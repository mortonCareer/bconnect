name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

# 같은 ref 에 새 커밋 push 시 이전 CI 취소 — self-hosted 러너(maxRunners 3) 슬롯을
# stale 런이 점유하는 것 방지 (#918). docs-lint.yml 과 동일 패턴.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# setup-node 의 cache: 'pnpm' 을 쓰지 않는다
# pnpm store 와 러너 툴 캐시를 노드 로컬 볼륨에 둔다
# homelab#269 (볼륨 도입) / homelab#270 (재배치 대응)
permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: morton-runner
    outputs:
      career: ${{ steps.filter.outputs.career }}
      plan: ${{ steps.filter.outputs.plan }}
      api: ${{ steps.filter.outputs.api }}
      api-spec: ${{ steps.filter.outputs.api-spec }}
      crawler: ${{ steps.filter.outputs.crawler }}
      packages: ${{ steps.filter.outputs.packages }}
    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            career:
              - 'apps/career/**'
              - 'packages/ui/**'
              - 'packages/features/**'
              - 'packages/push/**'
              - 'packages/business/**'
              - 'packages/devtools/**'
              - 'packages/config/**'
              - 'packages/mocks/**'
              - 'packages/api-client/src/*.ts'
              - 'packages/api-client/orval.*.ts'
              - 'packages/api-client/auth-supplement.ts'
              - 'packages/api-client/package.json'
              - 'packages/api-client/tsconfig.json'
              - 'package.json'
              - 'pnpm-lock.yaml'
            plan:
              - 'apps/plan/**'
              - 'packages/ui/**'
              - 'packages/features/**'
              - 'packages/push/**'
              - 'packages/devtools/**'
              - 'packages/config/**'
              - 'packages/mocks/**'
              - 'packages/api-client/src/*.ts'
              - 'packages/api-client/orval.*.ts'
              - 'packages/api-client/auth-supplement.ts'
              - 'packages/api-client/package.json'
              - 'packages/api-client/tsconfig.json'
              - 'package.json'
              - 'pnpm-lock.yaml'
            api:
              - 'apps/api/**'
            api-spec:
              - 'apps/api/**'
            crawler:
              - 'apps/crawler/**'
            packages:
              - '**/package.json'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - '.syncpackrc.json'
              - 'packages/ui/**'
              - 'packages/config/eslint/**'

  format:
    runs-on: morton-runner
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Format check
        run: pnpm format:check

  ci-career:
    needs: changes
    if: ${{ needs.changes.outputs.career == 'true' }}
    runs-on: morton-runner
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # postinstall 이 자동으로 pnpm api:generate 실행 (root package.json)
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm --filter @bconnect/career typecheck

      - name: Lint
        run: pnpm --filter @bconnect/career lint

      - name: Build
        run: pnpm --filter @bconnect/career build

  ci-plan:
    needs: changes
    if: ${{ needs.changes.outputs.plan == 'true' }}
    runs-on: morton-runner
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # postinstall 이 자동으로 pnpm api:generate 실행 (root package.json)
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm --filter @bconnect/plan typecheck

      - name: Lint
        run: pnpm --filter @bconnect/plan lint

      - name: Build
        run: pnpm --filter @bconnect/plan build

  ci-api:
    needs: changes
    if: ${{ needs.changes.outputs.api == 'true' }}
    runs-on: morton-runner
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Bruno CLI
        run: npm install -g @usebruno/cli

      - name: Build with Gradle
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          DATA_GO_SERVICE_KEY: ${{ secrets.DATA_GO_SERVICE_KEY }}
        working-directory: apps/api
        run: ./gradlew build

      - name: Start API server
        env:
          DATA_GO_SERVICE_KEY: ${{ secrets.DATA_GO_SERVICE_KEY }}
        working-directory: apps/api
        run: ./gradlew bootRun > bootrun.log 2>&1 &

      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health; then
              exit 0
            fi
            sleep 1
          done
          echo "API 서버 기동 실패"
          exit 1

      - name: Run Bruno demo collection
        working-directory: apps/api/bruno
        run: bru run --env local --exclude-tags=ws --reporter-html bruno-report.html

      - name: Upload API server log
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: api-bootrun-log
          path: apps/api/bootrun.log
          if-no-files-found: warn

      - name: Upload Bruno report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: bruno-report
          path: apps/api/bruno/bruno-report.html
          if-no-files-found: error

  ci-api-spec:
    needs: changes
    if: ${{ needs.changes.outputs.api-spec == 'true' }}
    runs-on: morton-runner
    permissions: write-all
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Generate Open API Docs
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          DATA_GO_SERVICE_KEY: ${{ secrets.DATA_GO_SERVICE_KEY }}
        working-directory: apps/api
        run: |
          ./gradlew build
          ./gradlew generateOpenApiDocs

      - name: Commit and Push changes
        run: |
          mv apps/api/build/openapi.yaml packages/api-client/src
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .
          if git diff --staged --quiet; then
            echo "스펙 변경 없음 — 커밋 스킵"
          else
            git commit -m "docs(api): generate open api document"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi

  ci-packages:
    needs: changes
    if: ${{ needs.changes.outputs.packages == 'true' }}
    runs-on: morton-runner
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # syncpack 으로 같은 dep 의 spec 불일치 차단 (workspace 전체).
      # 새 dep 이 2+ package 에 있으면 pnpm-workspace.yaml 의 catalog 사용 권장.
      - name: Check package versions
        run: pnpm package:check

      - name: Lint @bconnect/ui
        run: pnpm --filter @bconnect/ui lint

  ci-crawler:
    needs: changes
    if: ${{ needs.changes.outputs.crawler == 'true' }}
    runs-on: morton-runner
    defaults:
      run:
        working-directory: apps/crawler
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Run tests
        env:
          NAVER_CLIENT_ID: dummy
          NAVER_CLIENT_SECRET: dummy
          NOTION_TOKEN: dummy
        run: uv run --dev pytest tests/ -v
