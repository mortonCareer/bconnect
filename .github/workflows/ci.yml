name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      career: ${{ steps.filter.outputs.career }}
      plan: ${{ steps.filter.outputs.plan }}
      api: ${{ steps.filter.outputs.api }}
      api-spec: ${{ steps.filter.outputs.api-spec }}
      crawler: ${{ steps.filter.outputs.crawler }}
    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            career:
              - 'apps/career/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
            plan:
              - 'apps/plan/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
            api:
              - 'apps/api/**'
            api-spec:
              - 'packages/api-client/src/spec/**'
              - 'packages/api-client/.redocly.yaml'
            crawler:
              - 'apps/crawler/**'

  ci-career:
    needs: changes
    if: ${{ needs.changes.outputs.career == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter morton-career lint

      - name: Format check
        run: pnpm format:check

  ci-plan:
    needs: changes
    if: ${{ needs.changes.outputs.plan == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter morton-plan lint

      - name: Format check
        run: pnpm format:check

  ci-api:
    needs: changes
    if: ${{ needs.changes.outputs.api == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x apps/api/gradlew

      - name: Build with Gradle
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          cd apps/api
          ./gradlew build --no-daemon

      - name: Run tests
        run: |
          cd apps/api
          ./gradlew test --no-daemon

  ci-api-spec:
    needs: changes
    if: ${{ needs.changes.outputs.api-spec == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint OpenAPI spec
        run: pnpm api:lint

      - name: Bundle check (sanity)
        run: pnpm api:bundle

  ci-crawler:
    needs: changes
    if: ${{ needs.changes.outputs.crawler == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/crawler
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Run tests
        env:
          NAVER_CLIENT_ID: dummy
          NAVER_CLIENT_SECRET: dummy
          NOTION_TOKEN: dummy
        run: uv run --dev pytest tests/ -v
