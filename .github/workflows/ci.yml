name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      career: ${{ steps.filter.outputs.career }}
      plan: ${{ steps.filter.outputs.plan }}
      api: ${{ steps.filter.outputs.api }}
      api-spec: ${{ steps.filter.outputs.api-spec }}
      crawler: ${{ steps.filter.outputs.crawler }}
      packages: ${{ steps.filter.outputs.packages }}
    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # spec 만 변경된 PR 은 ci-career/ci-plan skip — spec ↔ FE drift 는
          # FE follow-up PR 에서 해소 (dev → main 의 ci-integration 가 최종 gate).
          # api-spec 자체는 항상 lint/bundle 검증.
          #
          # dorny/paths-filter 는 패턴 리스트를 OR 로 평가하고 '!' negation 은
          # subtractive 가 아니다 — 'packages/**' 광역 패턴 + '!spec/**' 로는
          # spec PR 을 못 뺀다 (#357). career/plan 이 실제 소비하는 경로만
          # positive 로 나열한다. api-client 는 거의 전부 codegen 이라
          # 수기 작성분(src/*.ts) + orval 설정 + 패키지 메타만 트리거 대상.
          filters: |
            career:
              - 'apps/career/**'
              - 'packages/ui/**'
              - 'packages/config/**'
              - 'packages/mocks/**'
              - 'packages/api-client/src/*.ts'
              - 'packages/api-client/orval.*.ts'
              - 'packages/api-client/package.json'
              - 'packages/api-client/tsconfig.json'
              - 'package.json'
              - 'pnpm-lock.yaml'
            plan:
              - 'apps/plan/**'
              - 'packages/ui/**'
              - 'packages/config/**'
              - 'packages/mocks/**'
              - 'packages/api-client/src/*.ts'
              - 'packages/api-client/orval.*.ts'
              - 'packages/api-client/package.json'
              - 'packages/api-client/tsconfig.json'
              - 'package.json'
              - 'pnpm-lock.yaml'
            api:
              - 'apps/api/**'
            api-spec:
              - 'packages/api-client/src/spec/**'
              - 'packages/api-client/.redocly.yaml'
            crawler:
              - 'apps/crawler/**'
            packages:
              - '**/package.json'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - '.syncpackrc.json'

  ci-career:
    needs: changes
    if: ${{ needs.changes.outputs.career == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      # postinstall 이 자동으로 pnpm api:generate 실행 (root package.json)
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm --filter morton-career typecheck

      - name: Lint
        run: pnpm --filter morton-career lint

      - name: Format check
        run: pnpm format:check

  ci-plan:
    needs: changes
    if: ${{ needs.changes.outputs.plan == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      # postinstall 이 자동으로 pnpm api:generate 실행 (root package.json)
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm --filter morton-plan typecheck

      - name: Lint
        run: pnpm --filter morton-plan lint

      - name: Format check
        run: pnpm format:check

  ci-api:
    needs: changes
    if: ${{ needs.changes.outputs.api == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x apps/api/gradlew

      - name: Build with Gradle
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          cd apps/api
          ./gradlew build --no-daemon

      - name: Run tests
        run: |
          cd apps/api
          ./gradlew test --no-daemon

  ci-api-spec:
    needs: changes
    if: ${{ needs.changes.outputs.api-spec == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint OpenAPI spec
        run: pnpm api:lint

      - name: Bundle check (sanity)
        run: pnpm api:bundle

  ci-packages:
    needs: changes
    if: ${{ needs.changes.outputs.packages == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # syncpack 으로 같은 dep 의 spec 불일치 차단 (workspace 전체).
      # 새 dep 이 2+ package 에 있으면 pnpm-workspace.yaml 의 catalog 사용 권장.
      - name: Check package versions
        run: pnpm package:check

  ci-crawler:
    needs: changes
    if: ${{ needs.changes.outputs.crawler == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/crawler
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Run tests
        env:
          NAVER_CLIENT_ID: dummy
          NAVER_CLIENT_SECRET: dummy
          NOTION_TOKEN: dummy
        run: uv run --dev pytest tests/ -v
