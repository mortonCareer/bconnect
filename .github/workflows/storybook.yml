name: Storybook

on:
  push:
    branches: [main]
    paths:
      - 'packages/ui/**'
      - 'packages/storybook/**'
  pull_request:
    # paths 필터 없음 — closed 이벤트는 파일 변경 없이도 cleanup이 실행되어야 함
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  changes:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    outputs:
      storybook: ${{ github.event_name == 'push' || steps.filter.outputs.storybook == 'true' }}
    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            storybook:
              - 'packages/ui/**'
              - 'packages/storybook/**'

  deploy:
    needs: changes
    if: needs.changes.outputs.storybook == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Determine base path
        id: basepath
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "path=/morton/" >> "$GITHUB_OUTPUT"
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            echo "path=/morton/pr/${PR_NUMBER}/" >> "$GITHUB_OUTPUT"
            echo "dir=pr/${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Storybook
        working-directory: packages/storybook
        run: pnpm build-storybook -o storybook-static
        env:
          STORYBOOK_BASE: ${{ steps.basepath.outputs.path }}

      - name: Deploy to GitHub Pages (main)
        if: github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: packages/storybook/storybook-static
          keep_files: true

      - name: Deploy to GitHub Pages (PR preview)
        if: github.event_name == 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: packages/storybook/storybook-static
          destination_dir: ${{ steps.basepath.outputs.dir }}

      - name: Comment PR with preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const prNumber = parseInt(process.env.PR_NUMBER, 10)
            const url = `https://mortoncareer.github.io/morton/pr/${prNumber}/`
            const body = `**Storybook Preview**: ${url}`

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            })
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Storybook Preview')
            )
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              })
            }

  cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: gh-pages
          fetch-depth: 1

      - name: Remove PR preview
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          PR_DIR="pr/${PR_NUMBER}"
          if [ -d "$PR_DIR" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git rm -rf "$PR_DIR"
            git commit -m "chore: remove storybook preview for PR #${PR_NUMBER}"
            git push
          fi
