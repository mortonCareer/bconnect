# 통합검증 CI — dev → main PR 시 최종 build gate
#
# dev CI 도 typecheck/lint 모두 strict 통과 (#246 정책 변경)이라 typecheck
# 단계는 redundant 하지만, main 보호를 위한 defense in depth 로 유지.
# build 가 추가 검증 (typecheck 가 안 잡는 SSR/RSC/turbo 이슈 등).
name: Integration

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'

# 같은 ref 새 커밋 push 시 이전 통합검증 취소 — self-hosted 러너 슬롯 절약 (#918).
concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  integration:
    runs-on: morton-runner
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate API client
        run: pnpm api:generate

      - name: Type check (career)
        run: pnpm --filter @bconnect/career typecheck

      - name: Type check (plan)
        run: pnpm --filter @bconnect/plan typecheck

      - name: Build
        run: pnpm build
