# 전역 prettier 검사 — 모든 dev PR/push 에 적용(유일한 공통 게이트). codegen 불필요 → ignore-scripts.
name: ci-format

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

concurrency:
  group: ci-format-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-node-pnpm
        with:
          ignore-scripts: 'true'

      - name: Format check
        run: pnpm format:check
