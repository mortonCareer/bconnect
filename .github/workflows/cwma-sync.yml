name: CWMA Sync

on:
  schedule:
    - cron: '0 21 * * 2'
  workflow_dispatch:

jobs:
  sync:
    runs-on: morton-runner
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync CWMA retirement-fund data to Postgres
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CWMA_CSV_URL: ${{ vars.CWMA_CSV_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: pnpm --filter @bconnect/data-jobs cwma-sync

      - name: Notify Slack on failure or cancellation
        if: failure() || cancelled()
        run: |
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d '{"text":"🚨 *CWMA Sync 실패/취소*\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|워크플로우 로그 확인>"}'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
