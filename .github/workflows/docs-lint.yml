name: docs-lint

on:
  push:
    branches: [dev, main]
    paths:
      - 'docs/**'
      - '**/CLAUDE.md'
      - 'README.md'
      - '.markdownlint.jsonc'
      - 'lychee.toml'
      - '.lycheeignore'
      - '.github/workflows/docs-lint.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '**/CLAUDE.md'
      - 'README.md'
      - '.markdownlint.jsonc'
      - 'lychee.toml'
      - '.lycheeignore'
      - '.github/workflows/docs-lint.yml'

# 같은 PR/브랜치 push 연속 시 옛 run cancel
concurrency:
  group: docs-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          # SSoT 인 git 추적 docs 만 검사:
          # - docs/ 트리 (Diátaxis 4 카테고리 + ADR + write-docs.md 룰 적용 대상)
          # - 모든 CLAUDE.md (계층, AI 자동로드)
          # - 루트 README.md
          # .claude/ (스킬/에이전트), .github/ (template), apps/api/ 자체 docs 는
          # 자체 컨벤션 따르므로 본 lint scope 외.
          globs: |
            docs/**/*.md
            **/CLAUDE.md
            README.md

  link-check:
    name: lychee link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Restore lychee cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: lychee-${{ github.sha }}
          restore-keys: lychee-

      - name: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # markdownlint 와 동일 scope. lychee 는 `--base` 에 절대 경로 또는 URL 만 허용
          # — 생략하면 source 파일 위치 기준 상대 링크 자동 해결.
          args: >-
            --config lychee.toml
            --no-progress
            'docs/**/*.md'
            '**/CLAUDE.md'
            'README.md'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
