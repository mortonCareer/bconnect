name: KISCON Construction Sync

on:
  schedule:
    - cron: '0 21 * * 2'
  workflow_dispatch:
    inputs:
      full:
        description: 'Full sync (2003~present)'
        required: false
        default: 'false'
        type: boolean

jobs:
  sync:
    runs-on: morton-runner
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync KISCON construction data to Postgres
        env:
          DATA_GO_SERVICE_KEY: ${{ secrets.DATA_GO_SERVICE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_MONITORING_WEBHOOK_URL }}
        run: |
          if [ "${{ inputs.full }}" = "true" ]; then
            pnpm --filter @bconnect/data-jobs kiscon-construction-sync -- --full
          else
            pnpm --filter @bconnect/data-jobs kiscon-construction-sync
          fi

      - name: Notify Slack on failure
        if: failure()
        run: |
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d '{"text":"🚨 *KISCON Construction Sync 실패*\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|워크플로우 로그 확인>"}'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_MONITORING_WEBHOOK_URL }}
