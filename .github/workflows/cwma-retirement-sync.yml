name: CWMA Retirement Fund Sync

on:
  schedule:
    # 매월 1일 03:00 UTC (12:00 KST) — 월간 갱신 주기에 맞춤
    - cron: '0 3 1 * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/career
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Sync CWMA retirement fund data to Postgres
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CWMA_CSV_URL: ${{ vars.CWMA_CSV_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: pnpm exec tsx scripts/cwma-retirement-sync.ts

      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "{\"text\":\"🚨 *CWMA Retirement Fund Sync 실패*\n<${RUN_URL}|워크플로우 로그 확인>\"}"

      - name: Report failure to GitHub Issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          WORKFLOW_NAME="CWMA Retirement Fund Sync"
          EXISTING=$(gh issue list --label "🚨 sync-failure" --state open --search "$WORKFLOW_NAME" --json number -q '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "재실패: $RUN_URL"
          else
            gh issue create --title "🚨 ${WORKFLOW_NAME} 실패" \
              --label "🚨 sync-failure" \
              --body "Run: $RUN_URL"
          fi
