name: 디자인 수정사항
labels: ['퍼블리싱', '프론트엔드']
body:
  - type: dropdown
    id: app
    attributes:
      label: 서비스 종류
      options:
        - 기술자 앱
        - 업체 웹
        - 회사 홈페이지
        - 기타 (본문에 서술해주세요)
    validations:
      required: true

  - type: input
    id: figma-node
    attributes:
      label: Figma 노드 링크
      description: 프레임 · 컴포넌트 선택 후 'Copy link to selection'로 복사한 값을 입력해주세요.
      placeholder: https://www.figma.com/design/EFXofON7gTFbmbE2kB31SS/...?node-id=1234-5678
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: 본문
      placeholder: 수정사항에 대해 서술하고, 관련 이미지를 첨부해주세요.
    validations:
      required: true
