spring:
  application:
    name: api

  profiles:
    default: local

  jpa:
    open-in-view: false

    show-sql: true
    properties:
      hibernate:
        format_sql: true

    hibernate:
      ddl-auto: none
    defer-datasource-initialization: true
  sql:
    init:
      mode: always

  flyway:
    enabled: false

  # TODO: aws
  # cloud:
  #   aws:
  #     region:
  #       static: ${AWS_REGION}
  #     credentials:
  #       access-key: ${AWS_ACCESS_KEY_ID}
  #       secret-key: ${AWS_SECRET_ACCESS_KEY}

sentry:
  dsn: ${SENTRY_DSN:}
  send-default-pii: true
  traces-sample-rate: 1.0 # TODO: 트래픽 증가 시 0.1~0.2로 낮출 것
  environment: ${SENTRY_ENVIRONMENT:local}

management:
  endpoints:
    web:
      exposure:
        include: health
  metrics:
    enable:
      process: false
      system: false

app:
  cors:
    allowed-origins:
      - ${CORS_ALLOWED_ORIGIN:http://localhost:3000}
    allowed-origin-patterns:
      - https://morton-career*.vercel.app
      - https://morton-plan*.vercel.app

  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 1h
    refresh-token-expiration: 7d
