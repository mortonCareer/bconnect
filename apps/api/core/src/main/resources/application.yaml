spring:
  application:
    name: api

  profiles:
    default: local

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

  flyway:
    enabled: false

  cloud:
    aws:
      region:
        static: ${AWS_REGION}
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID}
        secret-key: ${AWS_SECRET_ACCESS_KEY}

management:
  metrics:
    enable:
      process: false
      system: false

app:
  cors:
    allowed-origins:
      - ${CORS_ALLOWED_ORIGIN:http://localhost:3000}
    allowed-origin-patterns:
      - https://morton-career*.vercel.app
      - https://morton-plan*.vercel.app
