spring:
  datasource:
    url: jdbc:h2:mem:db;mode=postgresql;DB_CLOSE_ON_EXIT=FALSE

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: false
  sql:
    init:
      mode: never

app:
  jwt:
    secret: test-secret-key-for-jwt-authentication-minimum-256-bits