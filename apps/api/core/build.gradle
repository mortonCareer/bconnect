plugins {
    id 'org.springframework.boot'
}

bootJar.enabled = true
jar.enabled = false

dependencies {
    implementation project(':support')
    implementation project(':storage')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // socketio
    implementation 'com.corundumstudio.socketio:netty-socketio:2.0.12'

    // db
    implementation 'org.springframework.boot:spring-boot-h2console'

    // aws (TODO)
    // implementation 'software.amazon.awssdk:s3:2.42.0'
    // implementation platform('io.awspring.cloud:spring-cloud-aws-dependencies:4.0.0')
    // implementation 'io.awspring.cloud:spring-cloud-aws-starter'
    // implementation 'io.awspring.cloud:spring-cloud-aws-starter-s3'

    // jwt
    implementation("io.jsonwebtoken:jjwt-api:0.13.0")
    runtimeOnly ("io.jsonwebtoken:jjwt-impl:0.13.0")
    runtimeOnly("io.jsonwebtoken:jjwt-orgjson:0.13.0")

    // monitor
    implementation 'io.micrometer:micrometer-core'

    // test
    testImplementation "org.testcontainers:testcontainers"
    testImplementation "org.testcontainers:testcontainers-junit-jupiter"
    testImplementation "org.testcontainers:testcontainers-mysql"

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
}
