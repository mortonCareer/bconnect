spring:
  application:
    name: api
  profiles:
    default: local

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
        order_inserts: true
        order_updates: true
        jdbc:
          batch_size: 50
    show-sql: true

  sql:
    init:
      platform: postgresql

  flyway:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  metrics:
    enable:
      process: false
      system: false

app:
  timezone: Asia/Seoul

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGIN}
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS}

  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 1h
    refresh-token-expiration: 7d
    cookie-domain: ${COOKIE_DOMAIN}

  data-go:
    service-key: ${DATA_GO_SERVICE_KEY}

  s3:
    region: ${AWS_REGION}
    bucket: ${AWS_S3_BUCKET}

  cloudfront:
    domain: ${CLOUDFRONT_DOMAIN}
    key-pair-id: ${CLOUDFRONT_KEY_PAIR_ID}
    private-key: ${CLOUDFRONT_PRIVATE_KEY}
    cookie-domain: ${CLOUDFRONT_COOKIE_DOMAIN}
    cookie-ttl: 1h

  attachment:
    max-file-size: 20MB
    max-batch-size: 50
    presign-ttl: 10m
    allowed-content-types:
      - image/*
      - application/*

  sns:
    region: ${AWS_REGION}
    platform-arn: ${AWS_SNS_PLATFORM_ARN}

springdoc:
  swagger-ui:
    enabled: false