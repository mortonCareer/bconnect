spring:
  application:
    name: api
  profiles:
    default: local

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100
        order_inserts: true
        order_updates: true
        jdbc:
          batch_size: 50

  sql:
    init:
      platform: postgresql

  flyway:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  metrics:
    enable:
      process: false
      system: false

app:
  timezone: Asia/Seoul

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGIN}
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS}

  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 1h
    refresh-token-expiration: 7d
    cookie-domain: ${COOKIE_DOMAIN}

  retention:
    abuse: 365d
    transaction-party: 365d

  data-go:
    service-key: ${DATA_GO_SERVICE_KEY}

  attachment:
    max-file-size: 20MB
    max-batch-size: 50
    presign-ttl: 10m
    allowed-content-types:
      - image/*
      - application/*

springdoc:
  swagger-ui:
    enabled: false