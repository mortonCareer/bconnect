spring:
  datasource:
    url: jdbc:h2:mem:db;mode=postgresql;DB_CLOSE_ON_EXIT=FALSE

  h2:
    console:
      enabled: true
      path: /h2-console

  sql:
    init:
      platform: h2
      data-locations:
        - classpath:data.sql
        - classpath:data-crawler.sql

app:
  cors:
    allowed-origins:
      - http://localhost:3000
    allowed-origin-patterns:
      - "http://localhost:[*]"
      - "http://127.0.0.1:[*]"

  jwt:
    secret: test-secret-key-for-jwt-authentication-minimum-256-bits
    cookie-domain: localhost

  data-go:
    service-key: ${DATA_GO_SERVICE_KEY:local-service-key}

  sms:
    api-key: local-api-key
    api-secret: local-api-secret
    sender-number: "01000000000"

  s3:
    bucket: local-bucket

  cloudfront:
    domain: local-cloudfront-domain
    cookie-domain: localhost
    key-pair-id: local-key-pair-id
    private-key: local-private-key

  sns:
    platform-application-arn: local-platform-application-arn

logging:
  level:
    org.springframework.web.socket: TRACE
    org.springframework.messaging.simp.stomp: TRACE
