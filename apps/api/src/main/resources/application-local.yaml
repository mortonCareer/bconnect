spring:
  datasource:
    url: jdbc:h2:mem:db;mode=postgresql;DB_CLOSE_ON_EXIT=FALSE

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

app:
  jwt:
    secret: test-secret-key-for-jwt-authentication-minimum-256-bits
  sms:
    api-key: local-dummy-api-key
    api-secret: local-dummy-api-secret
    sender-number: "01000000000"
  s3:
    bucket: local-dummy-bucket
  cloudfront:
    key-pair-id: local-dummy-key-pair-id
    private-key: local-dummy-private-key

logging:
  level:
    org.springframework.web.socket: TRACE
    org.springframework.messaging.simp.stomp: TRACE
