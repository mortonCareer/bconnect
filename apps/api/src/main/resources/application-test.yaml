spring:
  datasource:
    url: jdbc:tc:postgresql:latest:///test

  sql:
    init:
      mode: always
      data-locations:
        - classpath:data.sql
        - classpath:data-crawler.sql

app:
  jwt:
    secret: test-secret-key-for-jwt-authentication-minimum-256-bits

  data-go:
    service-key: test-service-key

  sms:
    api-key: test-api-key
    api-secret: test-api-secret
    sender-number: "01000000000"

  s3:
    bucket: test-bucket

  cloudfront:
    key-pair-id: test-key-pair-id
    private-key: test-private-key

  sns:
    platform-application-arn: test-platform-application-arn