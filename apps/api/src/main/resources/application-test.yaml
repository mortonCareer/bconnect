spring:
  datasource:
    url: jdbc:tc:postgresql:latest:///test

  sql:
    init:
      mode: always
      data-locations:
        - classpath:data.sql
        - classpath:data-crawler.sql

app:
  cors:
    allowed-origins: "http://localhost:3000"
    allowed-origin-patterns:
    - "http://localhost:[*]"
    - "http://127.0.0.1:[*]"

  jwt:
    secret: test-secret-key-for-jwt-authentication-minimum-256-bits
    cookie-domain: localhost

  data-go:
    service-key: test-service-key

  s3:
    region: test-region
    bucket: test-bucket

  cloudfront:
    key-pair-id: test-key-pair-id
    private-key: test-private-key