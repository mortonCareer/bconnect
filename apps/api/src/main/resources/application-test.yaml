spring:
  datasource:
    url: jdbc:tc:postgresql:latest:///test

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
      schema-locations: classpath:schema-postgresql.sql
      data-locations: optional:classpath:test-data-none.sql

app:
  jwt:
    secret: test-secret-key-for-jwt-authentication-minimum-256-bits
  sms:
    api-key: test-dummy-api-key
    api-secret: test-dummy-api-secret
    sender-number: "01000000000"
  s3:
    bucket: test-dummy-bucket
  cloudfront:
    key-pair-id: test-dummy-key-pair-id
    private-key: test-dummy-private-key