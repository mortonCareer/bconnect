spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  sql:
    init:
      schema-locations:
        - classpath:schema-postgresql.sql

sentry:
  dsn: ${SENTRY_DSN}
  send-default-pii: true
  traces-sample-rate: 1.0
  environment: dev

app:
  jwt:
    cookie-domain: ${COOKIE_DOMAIN}

  cors:
    allowed-origin-patterns:
      - https://bconnect-career*.vercel.app
      - https://bconnect-plan*.vercel.app
      - https://*.bconnect.to
      - https://*.dev.bconnect.to
      - "http://localhost:[*]"

  sms:
    api-key: ${SOLAPI_API_KEY}
    api-secret: ${SOLAPI_API_SECRET}
    sender-number: ${SOLAPI_SENDER_NUMBER}
