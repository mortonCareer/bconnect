spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

sentry:
  dsn: ${SENTRY_DSN:}
  send-default-pii: true
  traces-sample-rate: 1.0
  environment: ${SENTRY_ENVIRONMENT:dev}

app:
  jwt:
    cookie-domain: ${COOKIE_DOMAIN:.bconnect.to}

  cors:
    allowed-origin-patterns:
      - https://bconnect-career*.vercel.app
      - https://bconnect-plan*.vercel.app
      - https://*.bconnect.to
      - https://*.dev.bconnect.to
      - "http://localhost:[*]"
