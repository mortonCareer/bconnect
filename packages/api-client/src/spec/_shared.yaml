components:
  schemas:
    Address:
      type: object
      required:
        - zipcode
        - city
        - state
        - street
        - latitude
        - longitude
      properties:
        zipcode:
          type: string
          pattern: \d{5}
          example: '04524'
        city:
          type: string
        state:
          type: string
        street:
          type: string
        detail:
          type:
            - string
            - 'null'
        latitude:
          type: number
          format: double
          example: 37.5666805
        longitude:
          type: number
          format: double
          example: 126.9784147
    ApiError:
      type: object
      required:
        - code
        - status
      properties:
        code:
          type: string
          example: C001
        status:
          type: string
          example: BAD_REQUEST
    ApiErrorResponse:
      type: object
      required:
        - success
        - error
        - data
      properties:
        success:
          type: boolean
          const: false
        error:
          $ref: '#/components/schemas/ApiError'
        data:
          type:
            - object
            - 'null'
          example:
    ApiSuccessResponseBase:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          example: true
          const: true

  securitySchemes:
    # Access Token
    # https://datatracker.ietf.org/doc/html/rfc7235 — HTTP Authentication framework
    # https://datatracker.ietf.org/doc/html/rfc6750 — OAuth 2.0 Bearer Token Usage
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT # https://datatracker.ietf.org/doc/html/rfc7519#section-4.1
      # OpenAPI 표준은 securityScheme ↔ token payload schema 의 의미 link 메커니즘 부재 →
      # `x-` extension (Specification Extensions, OAS §4.9) 으로 의미 명시.
      # 효과: spec 차원 contract 등록 + redocly bundle 의 ref traversal entry 가 되어
      # JwtPayload 가 자동 bundle 에 포함됨 (root manifest 불필요).
      x-jwt-payload-schema:
        $ref: 'v1/auth.yaml#/components/schemas/JwtPayload'
      description: |
        JWT Access Token (15분 만료).

        헤더 형식: `Authorization: Bearer <jwt>` (RFC 6750)

        Payload 구조: [`JwtPayload`](#/components/schemas/JwtPayload) 참조 (RFC 7519 표준 claims + Morton custom claims).

        Lifecycle:
        - 발급: `POST /api/v1/auth/otp/verify` 응답의 `accessToken`
        - 갱신: `POST /api/v1/auth/refresh` (cookieAuth 사용)

        에러:
        - `A007` 유효하지 않은 액세스 토큰입니다 (401)
        - `A008` 세션이 만료되었습니다 (401)

    # Refresh Token — opaque (RFC 6749 의 OAuth2 refresh_token 패턴)
    # https://datatracker.ietf.org/doc/html/rfc6749#section-1.5
    cookieAuth:
      type: apiKey
      in: cookie
      name: refreshToken
