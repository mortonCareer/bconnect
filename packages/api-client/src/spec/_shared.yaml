components:
  schemas:
    Address:
      type: object
      required:
        - zipcode
        - city
        - state
        - street
        - latitude
        - longitude
      properties:
        zipcode:
          type: string
          pattern: \d{5}
          example: '04524'
        city:
          type: string
        state:
          type: string
        street:
          type: string
        detail:
          type:
            - string
            - 'null'
        latitude:
          type: number
          format: double
          example: 37.5666805
        longitude:
          type: number
          format: double
          example: 126.9784147
    ApiError:
      type: object
      required:
        - code
        - status
      properties:
        code:
          type: string
          example: C001
        status:
          type: string
          example: BAD_REQUEST
    ApiErrorResponse:
      type: object
      required:
        - success
        - error
        - data
      properties:
        success:
          type: boolean
          const: false
        error:
          $ref: '#/components/schemas/ApiError'
        data:
          type:
            - object
            - 'null'
          example:
    ApiSuccessResponseBase:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          example: true
          const: true

    # JWT Access Token 의 payload 구조 — bearerAuth scheme 의 token 디코딩 결과.
    # OpenAPI 표준은 bearerFormat: JWT 만 hint, payload schema 표현 메커니즘 없음 →
    # 별도 schema 로 정의해 BE/FE contract 동기화. 사용처: bearerAuth.description 의 markdown link.
    JwtPayload:
      type: object
      required:
        - sub
        - role
        - exp
        - iat
      properties:
        # RFC 7519 표준 Registered Claims
        sub: # https://datatracker.ietf.org/doc/html/rfc7519#section-4.1.2
          type: string
          description: Subject — Member ID
          example: '12345'
        exp: # https://datatracker.ietf.org/doc/html/rfc7519#section-4.1.4
          type: integer
          format: int64
          description: Expiration Time — 만료 unix timestamp (15분 후)
          example: 1709251200
        iat: # https://datatracker.ietf.org/doc/html/rfc7519#section-4.1.6
          type: integer
          format: int64
          description: Issued At — 발급 unix timestamp
          example: 1709250300
        iss: # https://datatracker.ietf.org/doc/html/rfc7519#section-4.1.1
          type: string
          description: Issuer
          example: bconnect.to

        # Morton Private Claims (RFC 7519 §4.3)
        # https://datatracker.ietf.org/doc/html/rfc7519#section-4.3
        role:
          $ref: v1/members.yaml#/components/schemas/Role

  securitySchemes:
    # Access Token
    # https://datatracker.ietf.org/doc/html/rfc7235 — HTTP Authentication framework
    # https://datatracker.ietf.org/doc/html/rfc6750 — OAuth 2.0 Bearer Token Usage
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT # https://datatracker.ietf.org/doc/html/rfc7519#section-4.1
      description: |
        JWT Access Token (15분 만료).

        헤더 형식: `Authorization: Bearer <jwt>` (RFC 6750)

        Payload 구조: [`JwtPayload`](#/components/schemas/JwtPayload) 참조 (RFC 7519 표준 claims + Morton custom claims).

        Lifecycle:
        - 발급: `POST /api/v1/auth/otp/verify` 응답의 `accessToken`
        - 갱신: `POST /api/v1/auth/refresh` (cookieAuth 사용)

        에러:
        - `A007` 유효하지 않은 액세스 토큰입니다 (401)
        - `A008` 세션이 만료되었습니다 (401)

    # Refresh Token — opaque (RFC 6749 의 OAuth2 refresh_token 패턴)
    # https://datatracker.ietf.org/doc/html/rfc6749#section-1.5
    cookieAuth:
      type: apiKey
      in: cookie
      name: refreshToken
