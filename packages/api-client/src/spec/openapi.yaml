components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        인증이 필요한 엔드포인트에 공통으로 다음 에러를 반환할 수 있습니다.
        - `A007` 유효하지 않은 액세스 토큰입니다 (401)
        - `A008` 세션이 만료되었습니다 (401)
    cookieAuth:
      type: apiKey
      in: cookie
      name: refreshToken

  # 어떤 path 에서도 직접 $ref 되지 않지만 FE 가 error handling 에서 사용 →
  # bundle 에 포함되도록 명시적으로 등록.
  schemas:
    ApiError:
      $ref: ./components/schemas/ApiError.yaml
    ApiErrorResponse:
      $ref: ./components/schemas/ApiErrorResponse.yaml
