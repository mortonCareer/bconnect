openapi: 3.0.3
info:
  title: Bconnect API
  description: 인테리어 종사자를 위한 하도급 섭외 · 관리 플랫폼 '품앗이'의 REST API
  version: 0.2.0
servers:
  - url: http://localhost:8080
    description: 로컬 개발 서버
  - url: https://api.bconnect.to
    description: 프로덕션 서버
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: 인증 및 토큰 관리
  - name: Members
    description: 회원 정보 관리
  - name: Feeds
    description: 피드 관리
  - name: Posts
    description: 게시글 관리
  - name: Tasks
    description: 작업 사항 관리
  - name: Profiles
    description: 기술자 프로필 관리
  - name: Credentials
    description: 인증뱃지(자격/면허/증명서) 관리
  - name: Coworkers
    description: 동료 관계 관리
  - name: CoworkerRequests
    description: 동료 요청 관리
  - name: Recommendations
    description: 추천서 관리
  - name: Chats
    description: 채팅 관리
  - name: Devices
    description: 푸시 알림용 디바이스(브라우저) 토큰 관리
externalDocs:
  description: 개발 문서 (Notion)
  url: https://www.notion.so/morton-so/2dc965d2888b80ac9b72ca4d22812b12
