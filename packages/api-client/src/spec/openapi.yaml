openapi: 3.1.0
info:
  title: Bconnect API
  description: |
    인테리어 종사자를 위한 하도급 섭외 · 관리 플랫폼 '품앗이'의 REST API.

    ## 관련 문서

    - [개발 문서 (Notion)](https://www.notion.so/morton-so/2dc965d2888b80ac9b72ca4d22812b12) — 도메인 다이어그램 등 하위 페이지 포함
    - [와이어프레임 (Figma)](https://www.figma.com/design/iGTu8r553JZ7TZ5FVdxkoB/-Morton--%EA%B8%B0%ED%9A%8D---%EC%82%AC%EC%97%85?node-id=0-1)
  version: 0.2.0
servers:
  - url: http://localhost:8080
    description: 로컬 개발 서버
  - url: https://api.bconnect.to
    description: 프로덕션 서버
# 기본 인증: 없음(빈 배열)
# 인증이 필요한 부분은 별도로 작성
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: 인증 및 토큰 관리
  - name: Members
    description: 회원 정보 관리
  - name: Feeds
    description: 피드 관리
  - name: Posts
    description: 게시글 관리
  - name: Tasks
    description: 작업 사항 관리
  - name: Profiles
    description: 기술자 프로필 관리
  - name: Credentials
    description: 인증뱃지(자격/면허/증명서) 관리
  - name: Coworkers
    description: 동료 관계 관리
  - name: CoworkerRequests
    description: 동료 요청 관리
  - name: Recommendations
    description: 추천서 관리
  - name: Chats
    description: 채팅 관리
  - name: Devices
    description: 푸시 알림용 디바이스(브라우저) 토큰 관리
  - name: Attachments
    description: 파일 업로드 (presign·confirm)
  - name: Storages
    description: 저장소(폴더) 관리 — Storage + Attachment 매핑
