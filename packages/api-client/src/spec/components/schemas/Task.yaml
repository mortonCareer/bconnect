type: object
required:
  - id
  - company
  - address
  - taskTitle
  - eventTitle
  - trades
  - start
  - end
  - createdAt
  - modifiedAt
properties:
  id:
    type: integer
    format: int64
    example: 1
  profileId:
    type:
      - integer
      - 'null'
    format: int64
    example: 1
  company:
    type: string
  address:
    $ref: ./Address.yaml
  taskTitle:
    type: string
  eventTitle:
    type: string
  trades:
    type: array
    items:
      $ref: ./Trade.yaml
    uniqueItems: true
  start:
    type: string
    format: date
  end:
    type: string
    format: date
  createdAt:
    type: string
    format: date-time
  modifiedAt:
    type: string
    format: date-time
