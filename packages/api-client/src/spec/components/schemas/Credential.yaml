type: object
required:
  - id
  - profileId
  - type
  - status
  - createdAt
  - modifiedAt
properties:
  id:
    type: integer
    format: int64
    example: 1
  profileId:
    type: integer
    format: int64
    example: 1
  type:
    $ref: ./CredentialType.yaml
  status:
    $ref: ./CredentialStatus.yaml
  expiredAt:
    type:
      - string
      - 'null'
    format: date
  createdAt:
    type: string
    format: date-time
  modifiedAt:
    type: string
    format: date-time
