type: object
required:
  - id
  - username
  - name
  - createdAt
  - modifiedAt
properties:
  id:
    type: integer
    format: int64
    example: 1
  username:
    type: string
  name:
    type: string
  picture:
    type:
      - string
      - 'null'
  createdAt:
    type: string
    format: date-time
  modifiedAt:
    type: string
    format: date-time
