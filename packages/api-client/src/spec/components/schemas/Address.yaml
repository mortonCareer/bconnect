type: object
required:
  - zipcode
  - city
  - state
  - street
  - latitude
  - longitude
properties:
  zipcode:
    type: string
    pattern: \d{5}
    example: '04524'
  city:
    type: string
  state:
    type: string
  street:
    type: string
  detail:
    type: string
    nullable: true
  latitude:
    type: number
    format: double
    example: 37.5666805
  longitude:
    type: number
    format: double
    example: 126.9784147
