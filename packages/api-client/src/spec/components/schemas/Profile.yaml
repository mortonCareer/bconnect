type: object
required:
  - id
  - memberId
  - primaryTrade
  - trades
  - experience
  - address
  - createdAt
  - modifiedAt
properties:
  id:
    type: integer
    format: int64
    example: 1
  memberId:
    type: integer
    format: int64
    example: 1
  primaryTrade:
    $ref: ./Trade.yaml
  trades:
    type: array
    items:
      $ref: ./Trade.yaml
    uniqueItems: true
  experience:
    type: integer
  headline:
    type:
      - string
      - 'null'
  about:
    type:
      - string
      - 'null'
  address:
    $ref: ./Address.yaml
  createdAt:
    type: string
    format: date-time
  modifiedAt:
    type: string
    format: date-time
