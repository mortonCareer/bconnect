type: object
required:
  - company
  - address
  - taskTitle
  - eventTitle
  - trades
  - start
  - end
properties:
  company:
    type: string
  address:
    $ref: ./Address.yaml
  taskTitle:
    type: string
  eventTitle:
    type: string
  trades:
    type: array
    items:
      $ref: ./Trade.yaml
    uniqueItems: true
  start:
    type: string
    format: date
  end:
    type: string
    format: date
