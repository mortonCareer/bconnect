type: object
required:
  - id
  - images
  - createdAt
  - modifiedAt
properties:
  id:
    type: integer
    format: int64
    example: 1
  profileId:
    type:
      - integer
      - 'null'
    format: int64
    example: 1
  taskId:
    type:
      - integer
      - 'null'
    format: int64
    example: 1
  images:
    type: array
    items:
      type: string
  content:
    type:
      - string
      - 'null'
  createdAt:
    type: string
    format: date-time
  modifiedAt:
    type: string
    format: date-time
