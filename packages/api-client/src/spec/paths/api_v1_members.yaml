get:
  operationId: getMembers
  tags:
    - Members
  summary: 회원 목록 조회 (ADMIN)
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/ApiSuccessResponseBase.yaml
              - type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: ../components/schemas/Member.yaml
post:
  operationId: registerMember
  tags:
    - Members
  security: []
  summary: 회원가입
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/RegisterMemberRequest.yaml
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/ApiSuccessResponseBase.yaml
              - type: object
                required:
                  - data
                properties:
                  data:
                    type: integer
                    format: int64
    '400':
      description: |
        - `C001` 유효하지 않은 입력값입니다
        - `A009` 유효하지 않은 가입 토큰입니다
        - `A010` 가입 토큰이 만료되었습니다
