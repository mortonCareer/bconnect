post:
  operationId: refreshToken
  tags:
    - Auth
  security:
    - cookieAuth: []
  summary: 토큰 갱신
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../../../components/schemas/ApiSuccessResponseBase.yaml
              - type: object
                required:
                  - data
                properties:
                  data:
                    $ref: ../../../components/schemas/RefreshTokenResponse.yaml
    '401':
      description: |
        - `A006` 유효하지 않은 리프레시 토큰입니다
      content:
        application/json:
          schema:
            $ref: ../../../components/schemas/ApiErrorResponse.yaml
