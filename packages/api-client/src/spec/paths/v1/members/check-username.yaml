get:
  operationId: checkUsername
  tags:
    - Members
  security: []
  summary: 사용자명 중복 확인
  parameters:
    - name: username
      in: query
      required: true
      schema:
        type: string
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../../../_shared/components/schemas/ApiSuccessResponseBase.yaml
              - type: object
                required:
                  - data
                properties:
                  data:
                    $ref: ../../../components/schemas/CheckUsernameResponse.yaml
    '400':
      description: |
        - `C001` 유효하지 않은 입력값입니다
      content:
        application/json:
          schema:
            $ref: ../../../_shared/components/schemas/ApiErrorResponse.yaml
