get:
  operationId: getFeeds
  tags:
    - Feeds
  security: []
  summary: 피드 목록 조회
  parameters:
    - name: profileId
      in: query
      required: false
      schema:
        type: integer
        format: int64
    - name: offset
      in: query
      required: false
      schema:
        type: integer
        default: 0
    - name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 20
    - name: reverse
      in: query
      required: false
      schema:
        type: boolean
        default: false
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../../../_shared/components/schemas/ApiSuccessResponseBase.yaml
              - type: object
                required:
                  - data
                properties:
                  data:
                    $ref: ../../../components/schemas/FeedOffsetPage.yaml
