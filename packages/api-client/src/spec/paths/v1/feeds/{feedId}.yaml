      content:
        application/json:
          schema:
            allOf:
              - $ref: ../../../components/schemas/ApiSuccessResponseBase.yaml
              - type: object
                required:
                  - data
                properties:
                  data:
                    $ref: ../../../components/schemas/Feed.yaml
