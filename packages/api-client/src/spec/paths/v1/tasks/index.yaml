get:
  operationId: getMyTasks
  tags:
    - Tasks
  summary: 내 작업 목록 조회
  parameters:
    - name: start
      in: query
      required: true
      schema:
        type: string
        format: date
    - name: end
      in: query
      required: true
      schema:
        type: string
        format: date
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../../../components/schemas/ApiSuccessResponseBase.yaml
              - type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: ../../../components/schemas/Task.yaml
post:
  operationId: createTask
  tags:
    - Tasks
  summary: 작업 생성
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../../components/schemas/CreateTaskRequest.yaml
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../../../components/schemas/ApiSuccessResponseBase.yaml
              - type: object
                required:
                  - data
                properties:
                  data:
                    type: integer
                    format: int64
    '400':
      description: |
        - `C001` 유효하지 않은 입력값입니다
      content:
        application/json:
          schema:
            $ref: ../../../components/schemas/ApiErrorResponse.yaml
