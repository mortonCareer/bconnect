get:
  operationId: getCredentials
  tags:
    - Credentials
  security: []
  summary: 인증뱃지 목록 조회
  parameters:
    - name: profileId
      in: query
      required: true
      description: 프로필 ID
      schema:
        type: integer
        format: int64
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../../../components/schemas/ApiSuccessResponseBase.yaml
              - type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: ../../../components/schemas/Credential.yaml
post:
  operationId: createCredential
  tags:
    - Credentials
  summary: 인증뱃지 등록
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../../components/schemas/CreateCredentialRequest.yaml
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../../../components/schemas/ApiSuccessResponseBase.yaml
              - type: object
                required:
                  - data
                properties:
                  data:
                    type: integer
                    format: int64
    '400':
      description: |
        - `C001` 유효하지 않은 입력값입니다
      content:
        application/json:
          schema:
            $ref: ../../../components/schemas/ApiErrorResponse.yaml
