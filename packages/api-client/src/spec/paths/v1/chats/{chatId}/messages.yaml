get:
  operationId: getChatMessages
  tags:
    - Chats
  summary: 채팅방 메시지 목록 조회
  parameters:
    - name: chatId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    - name: cursor
      in: query
      required: false
      description: 페이지네이션 커서 (null이면 최신 메시지부터)
      schema:
        type: string
    - name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 20
    - name: reverse
      in: query
      required: false
      schema:
        type: boolean
        default: false
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../../../../components/schemas/ApiSuccessResponseBase.yaml
              - type: object
                required:
                  - data
                properties:
                  data:
                    $ref: ../../../../components/schemas/MessageCursorPage.yaml
