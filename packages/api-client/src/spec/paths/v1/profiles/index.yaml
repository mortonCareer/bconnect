get:
  operationId: getProfiles
  tags:
    - Profiles
  security: []
  summary: 프로필 목록 조회
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../../../_shared/components/schemas/ApiSuccessResponseBase.yaml
              - type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: ../../../components/schemas/ProfileAndMember.yaml
post:
  operationId: createProfile
  tags:
    - Profiles
  summary: 프로필 생성
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../../components/schemas/CreateProfileRequest.yaml
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../../../_shared/components/schemas/ApiSuccessResponseBase.yaml
              - type: object
                required:
                  - data
                properties:
                  data:
                    type: integer
                    format: int64
    '400':
      description: |
        - `C001` 유효하지 않은 입력값입니다
      content:
        application/json:
          schema:
            $ref: ../../../_shared/components/schemas/ApiErrorResponse.yaml
