post:
  operationId: sendOtp
  tags:
    - Auth
  security: []
  summary: 인증코드 발송
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/SendCodeRequest.yaml
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/ApiSuccessResponseBase.yaml
              - type: object
                required:
                  - data
                properties:
                  data:
                    $ref: ../components/schemas/SendOtpResponse.yaml
    '400':
      description: |
        - `C001` 유효하지 않은 입력값입니다
    '429':
      description: |
        - `A001` 일일 발송 한도를 초과했습니다
        - `A002` 재전송 대기 시간이 지나지 않았습니다
