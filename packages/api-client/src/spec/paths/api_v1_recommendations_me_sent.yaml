get:
  operationId: getMySentRecommendations
  tags:
    - Recommendations
  summary: 내가 보낸 추천서 목록 조회
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/ApiSuccessResponseBase.yaml
              - type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: ../components/schemas/Recommendation.yaml
