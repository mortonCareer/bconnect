paths:
  /api/v1/recommendations:
    post:
      operationId: createRecommendation
      tags:
        - Recommendations
      summary: 추천서 보내기
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRecommendationRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ../_shared.yaml#/components/schemas/ApiSuccessResponseBase
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: integer
                        format: int64
  /api/v1/recommendations/received:
    get:
      operationId: getReceivedRecommendations
      tags:
        - Recommendations
      security: []
      summary: 받은 추천서 목록 조회
      parameters:
        - name: profileId
          in: query
          required: true
          description: 프로필 ID
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ../_shared.yaml#/components/schemas/ApiSuccessResponseBase
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Recommendation'
  /api/v1/recommendations/sent:
    get:
      operationId: getSentRecommendations
      tags:
        - Recommendations
      security: []
      summary: 보낸 추천서 목록 조회
      parameters:
        - name: profileId
          in: query
          required: true
          description: 프로필 ID
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ../_shared.yaml#/components/schemas/ApiSuccessResponseBase
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Recommendation'
  /api/v1/recommendations/me/received:
    get:
      operationId: getMyReceivedRecommendations
      tags:
        - Recommendations
      summary: 내가 받은 추천서 목록 조회
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ../_shared.yaml#/components/schemas/ApiSuccessResponseBase
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Recommendation'
  /api/v1/recommendations/me/sent:
    get:
      operationId: getMySentRecommendations
      tags:
        - Recommendations
      summary: 내가 보낸 추천서 목록 조회
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ../_shared.yaml#/components/schemas/ApiSuccessResponseBase
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Recommendation'
  /api/v1/recommendations/{id}:
    put:
      operationId: updateRecommendation
      tags:
        - Recommendations
      summary: 추천서 수정
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRecommendationRequest'
      responses:
        '200':
          description: OK
    delete:
      operationId: deleteRecommendation
      tags:
        - Recommendations
      summary: 추천서 삭제
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
  /api/v1/recommendations/{id}/hide:
    post:
      operationId: hideRecommendation
      tags:
        - Recommendations
      summary: 추천서 숨김
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
  /api/v1/recommendations/{id}/show:
    post:
      operationId: showRecommendation
      tags:
        - Recommendations
      summary: 추천서 숨김 해제
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
components:
  schemas:
    Recommendation:
      type: object
      required:
        - id
        - fromId
        - toId
        - content
        - visible
        - createdAt
        - modifiedAt
      properties:
        id:
          type: integer
          format: int64
          example: 1
        fromId:
          type: integer
          format: int64
          example: 1
        toId:
          type: integer
          format: int64
          example: 2
        content:
          type: string
        visible:
          type: boolean
        createdAt:
          type: string
          format: date-time
        modifiedAt:
          type: string
          format: date-time
    CreateRecommendationRequest:
      type: object
      required:
        - toId
        - content
      properties:
        toId:
          type: integer
          format: int64
        content:
          type: string
    UpdateRecommendationRequest:
      type: object
      required:
        - content
      properties:
        content:
          type: string
