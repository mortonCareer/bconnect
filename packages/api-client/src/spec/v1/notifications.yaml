paths:
  /api/v1/notifications:
    get:
      operationId: getNotifications
      tags:
        - Notifications
      summary: 알림 목록 조회 (커서 페이징)
      description: |
        현재 로그인 회원이 수신한 알림을 최신순(id desc)으로 조회.
        `message` 는 render-on-read — `NotificationType` 템플릿에 현재 발신자 이름을 치환한 결과(발신자 개명 시 자동 반영).
        딥링크는 `referenceType` + `referenceId` 로 구성(`/n/{referenceType}/{referenceId}`).
      parameters:
        - name: cursor
          in: query
          required: false
          description: 페이지네이션 커서 (null이면 최신부터)
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: reverse
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ../_shared.yaml#/components/schemas/ApiSuccessResponseBase
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/NotificationCursorPage'
  /api/v1/notifications/unread/count:
    get:
      operationId: getUnreadNotificationCount
      tags:
        - Notifications
      summary: 안 읽은 알림 개수
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ../_shared.yaml#/components/schemas/ApiSuccessResponseBase
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: integer
                        format: int64
                        example: 3
  /api/v1/notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags:
        - Notifications
      summary: 알림 단건 읽음 처리
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 읽음 처리 성공
          content:
            application/json:
              schema:
                $ref: ../_shared.yaml#/components/schemas/ApiSuccessResponseBase
        '403':
          description: |
            - `NT002` 해당 알림에 접근할 수 없습니다 (타인 소유 알림)
          content:
            application/json:
              schema:
                $ref: ../_shared.yaml#/components/schemas/ApiErrorResponse
        '404':
          description: |
            - `NT001` 존재하지 않는 알림입니다
          content:
            application/json:
              schema:
                $ref: ../_shared.yaml#/components/schemas/ApiErrorResponse
  /api/v1/notifications/read:
    patch:
      operationId: markAllNotificationsRead
      tags:
        - Notifications
      summary: 알림 모두 읽음 처리
      responses:
        '200':
          description: 모두 읽음 처리 성공
          content:
            application/json:
              schema:
                $ref: ../_shared.yaml#/components/schemas/ApiSuccessResponseBase
components:
  schemas:
    NotificationCursorPage:
      type: object
      required:
        - content
        - hasNext
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        nextCursor:
          type:
            - string
            - 'null'
        hasNext:
          type: boolean
    Notification:
      type: object
      required:
        - id
        - type
        - message
        - referenceType
        - referenceId
        - read
        - createdAt
      properties:
        id:
          type: integer
          format: int64
          example: 1
        type:
          type: string
          description: NotificationType code
          example: CHAT_MESSAGE
        message:
          type: string
          description: render-on-read 결과 (템플릿 + 현재 발신자 이름)
          example: 홍길동님이 메시지를 보냈습니다
        content:
          type:
            - string
            - 'null'
          description: 미리보기 스냅샷 (발송 시점 고정, nullable)
        referenceType:
          $ref: '#/components/schemas/NotificationReferenceType'
        referenceId:
          type: integer
          format: int64
          example: 42
        sender:
          oneOf:
            - $ref: '#/components/schemas/NotificationSender'
            - type: 'null'
          description: 발신자 요약 (시스템 알림이면 null)
        read:
          type: boolean
        createdAt:
          type: string
          format: date-time
    NotificationReferenceType:
      type: string
      description: 딥링크 대상 엔티티 타입 (소문자)
      enum:
        - chat_room
    NotificationSender:
      type: object
      required:
        - id
        - username
        - name
        - role
        - createdAt
        - modifiedAt
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        name:
          type: string
        picture:
          type:
            - string
            - 'null'
          format: image-url
        role:
          $ref: ../v1/members.yaml#/components/schemas/Role
        createdAt:
          type: string
          format: date-time
        modifiedAt:
          type: string
          format: date-time
