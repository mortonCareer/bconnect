paths:
  /api/v1/devices:
    post:
      operationId: registerDevice
      tags:
        - Devices
      summary: 푸시 알림 디바이스 토큰 등록
      description: |
        FCM 디바이스 토큰을 현재 로그인한 회원에게 UPSERT.
        같은 토큰이면 `last_active_at` 만 갱신, 바뀌었으면 교체.
        앱 진입마다 호출되는 idempotent 엔드포인트.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDeviceRequest'
      responses:
        '200':
          description: 등록/갱신 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ../_shared.yaml#/components/schemas/ApiSuccessResponseBase
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/RegisterDeviceResponse'
        '400':
          description: |
            - `C001` 유효하지 않은 입력값입니다 (token/platform 누락)
          content:
            application/json:
              schema:
                $ref: ../_shared.yaml#/components/schemas/ApiErrorResponse
    delete:
      operationId: unregisterDevice
      tags:
        - Devices
      summary: 푸시 알림 디바이스 토큰 해제
      description: |
        로그아웃 또는 디바이스 알림 해제 시 호출.
        다른 사용자가 같은 브라우저에 로그인했을 때 이전 사용자의 알림이 가지 않도록 삭제.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnregisterDeviceRequest'
      responses:
        '200':
          description: 해제 성공 (idempotent — 없는 토큰도 성공)
        '400':
          description: |
            - `C001` 유효하지 않은 입력값입니다 (token 누락)
          content:
            application/json:
              schema:
                $ref: ../_shared.yaml#/components/schemas/ApiErrorResponse
components:
  schemas:
    DevicePlatform:
      type: string
      enum:
        - web
        - android
        - ios
      description: |
        디바이스 플랫폼.
        - `web`: 브라우저 Web Push (FCM JS SDK 발급 토큰)
        - `android`, `ios`: 추후 네이티브 앱 출시 시 사용
    RegisterDeviceRequest:
      type: object
      required:
        - token
        - platform
      properties:
        token:
          type: string
          description: FCM 디바이스 토큰 (FCM SDK 가 발급한 고유 식별자, 150자 내외)
          example: eNkX...
        platform:
          $ref: '#/components/schemas/DevicePlatform'
    RegisterDeviceResponse:
      type: object
      required:
        - registered
      properties:
        registered:
          type: boolean
          description: true 고정 (등록/갱신 공통)
    UnregisterDeviceRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: 해제할 FCM 디바이스 토큰
