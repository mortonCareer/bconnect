paths:
  /api/v1/posts:
    post:
      operationId: createPost
      tags:
        - Posts
      summary: 게시글 생성
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ../_shared.yaml#/components/schemas/ApiSuccessResponseBase
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: integer
                        format: int64
        '400':
          description: |
            - `C001` 유효하지 않은 입력값입니다
          content:
            application/json:
              schema:
                $ref: ../_shared.yaml#/components/schemas/ApiErrorResponse
  /api/v1/posts/{postId}:
    parameters:
      - name: postId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    put:
      operationId: updatePost
      tags:
        - Posts
      summary: 게시글 수정
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePostRequest'
      responses:
        '200':
          description: OK
        '400':
          description: |
            - `C001` 유효하지 않은 입력값입니다
          content:
            application/json:
              schema:
                $ref: ../_shared.yaml#/components/schemas/ApiErrorResponse
    delete:
      operationId: deletePost
      tags:
        - Posts
      summary: 게시글 삭제
      responses:
        '200':
          description: OK
components:
  schemas:
    Post:
      type: object
      required:
        - id
        - attachments
        - createdAt
        - modifiedAt
      properties:
        id:
          type: integer
          format: int64
          example: 1
        profileId:
          type:
            - integer
            - 'null'
          format: int64
          example: 1
        taskId:
          type:
            - integer
            - 'null'
          format: int64
          example: 1
        attachments:
          type: array
          items:
            $ref: '../v1/attachments.yaml#/components/schemas/AttachmentMeta'
        content:
          type:
            - string
            - 'null'
        createdAt:
          type: string
          format: date-time
        modifiedAt:
          type: string
          format: date-time
    CreatePostRequest:
      type: object
      required:
        - attachmentIds
        - content
      properties:
        taskId:
          type:
            - integer
            - 'null'
          format: int64
          example: 1
        attachmentIds:
          type: array
          minItems: 1
          items:
            type: integer
            format: int64
        content:
          type: string
    UpdatePostRequest:
      type: object
      required:
        - content
      properties:
        content:
          type: string
