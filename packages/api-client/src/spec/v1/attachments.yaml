paths:
  /api/v1/attachments/presign:
    post:
      operationId: presignAttachments
      tags:
        - Attachments
      summary: 첨부 업로드용 Presigned PUT URL 발급
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresignRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ../_shared.yaml#/components/schemas/ApiSuccessResponseBase
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/PresignResponse'
        '400':
          description: |
            - `C001` 유효하지 않은 입력값입니다
          content:
            application/json:
              schema:
                $ref: ../_shared.yaml#/components/schemas/ApiErrorResponse
  /api/v1/attachments/confirm:
    post:
      operationId: confirmAttachments
      tags:
        - Attachments
      summary: 업로드 완료 확인
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ../_shared.yaml#/components/schemas/ApiSuccessResponseBase
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/ConfirmResponse'
        '400':
          description: |
            - `C001` 유효하지 않은 입력값입니다
          content:
            application/json:
              schema:
                $ref: ../_shared.yaml#/components/schemas/ApiErrorResponse
components:
  schemas:
    AttachmentStatus:
      type: string
      enum:
        - PENDING
        - COMPLETED
        - FAILED
    AttachmentMeta:
      type: object
      required:
        - id
        - path
        - filename
        - contentType
        - size
      properties:
        id:
          type: integer
          format: int64
        path:
          type: string
          description: S3 key 디렉토리 prefix (예 chats/42/images, credentials/7/files)
        filename:
          type: string
        contentType:
          type: string
        size:
          type: integer
          format: int64
          description: bytes
    PresignFileRequest:
      type: object
      required:
        - filename
        - size
        - contentType
      properties:
        filename:
          type: string
        size:
          type: integer
          format: int64
        contentType:
          type: string
    PresignFileResponse:
      type: object
      required:
        - attachmentId
        - uploadUrl
      properties:
        attachmentId:
          type: integer
          format: int64
        uploadUrl:
          type: string
          format: uri
          description: 클라이언트가 PUT 으로 업로드할 S3 presigned URL
    PresignRequest:
      type: object
      required:
        - files
      properties:
        files:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/PresignFileRequest'
    PresignResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PresignFileResponse'
    ConfirmRequest:
      type: object
      required:
        - attachmentIds
      properties:
        attachmentIds:
          type: array
          minItems: 1
          items:
            type: integer
            format: int64
    ConfirmItem:
      type: object
      required:
        - attachmentId
        - status
      properties:
        attachmentId:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/AttachmentStatus'
        attachment:
          oneOf:
            - $ref: '#/components/schemas/AttachmentMeta'
            - type: 'null'
    ConfirmResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ConfirmItem'
