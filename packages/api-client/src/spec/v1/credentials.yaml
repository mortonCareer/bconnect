paths:
  /api/v1/credentials:
    get:
      operationId: getCredentials
      tags:
        - Credentials
      security: []
      summary: 인증뱃지 목록 조회
      parameters:
        - name: profileId
          in: query
          required: true
          description: 프로필 ID
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ../_shared.yaml#/components/schemas/ApiSuccessResponseBase
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Credential'
    post:
      operationId: createCredential
      tags:
        - Credentials
      summary: 인증뱃지 등록
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCredentialRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ../_shared.yaml#/components/schemas/ApiSuccessResponseBase
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: integer
                        format: int64
        '400':
          description: |
            - `C001` 유효하지 않은 입력값입니다
          content:
            application/json:
              schema:
                $ref: ../_shared.yaml#/components/schemas/ApiErrorResponse
  /api/v1/credentials/types:
    get:
      operationId: getCredentialTypes
      tags:
        - Credentials
      security: []
      summary: 인증뱃지 타입 목록 조회
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ../_shared.yaml#/components/schemas/ApiSuccessResponseBase
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CredentialType'
  /api/v1/credentials/{credentialId}:
    delete:
      operationId: deleteCredential
      tags:
        - Credentials
      summary: 인증뱃지 삭제
      parameters:
        - name: credentialId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
  /api/v1/credentials/{credentialId}/accept:
    post:
      operationId: acceptCredential
      tags:
        - Credentials
      summary: 인증뱃지 승인 (ADMIN)
      parameters:
        - name: credentialId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
  /api/v1/credentials/{credentialId}/deny:
    post:
      operationId: denyCredential
      tags:
        - Credentials
      summary: 인증뱃지 거부 (ADMIN)
      parameters:
        - name: credentialId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
components:
  schemas:
    Credential:
      type: object
      required:
        - id
        - profileId
        - type
        - status
        - createdAt
        - modifiedAt
      properties:
        id:
          type: integer
          format: int64
          example: 1
        profileId:
          type: integer
          format: int64
          example: 1
        type:
          $ref: '#/components/schemas/CredentialType'
        status:
          $ref: '#/components/schemas/CredentialStatus'
        expiredAt:
          type:
            - string
            - 'null'
          format: date
        createdAt:
          type: string
          format: date-time
        modifiedAt:
          type: string
          format: date-time
    CredentialStatus:
      type: string
      enum:
        - PENDING
        - ACCEPTED
        - DENIED
    CredentialType:
      type: string
      enum:
        - IDENTITY_VERIFICATION
        - SOLE_PROPRIETOR
        - CONSTRUCTION_LICENSE
        - SPECIALTY_CONSTRUCTION_LICENSE
        - CAREER_CERTIFICATE
        - SKILL_GRADE_CERTIFICATE
        - OTHER_CERTIFICATE
        - NATIONAL_TECHNICAL_QUALIFICATION
        - SKILLED_TECHNICIAN
        - OTHER_QUALIFICATION
    CreateCredentialRequest:
      type: object
      required:
        - type
      properties:
        type:
          $ref: '#/components/schemas/CredentialType'
        expiredAt:
          type:
            - string
            - 'null'
          format: date
