paths:
  /api/v1/coworkers:
    get:
      operationId: getCoworkers
      tags:
        - Coworkers
      summary: 동료 목록 조회
      parameters:
        - name: profileId
          in: query
          required: true
          description: 프로필 ID
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ../_shared.yaml#/components/schemas/ApiSuccessResponseBase
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Coworker'
  /api/v1/coworkers/{coworkerId}:
    delete:
      operationId: deleteCoworker
      tags:
        - Coworkers
      summary: 동료 삭제
      parameters:
        - name: coworkerId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
  /api/v1/coworkers/tasks:
    get:
      operationId: getCoworkerTasks
      tags:
        - Tasks
      summary: 지인 작업목록 조회
      parameters:
        - name: start
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: end
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ../_shared.yaml#/components/schemas/ApiSuccessResponseBase
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CoworkerTask'
components:
  schemas:
    Coworker:
      type: object
      required:
        - id
        - member
        - status
      properties:
        id:
          type: integer
          format: int64
          example: 1
        member:
          $ref: ../v1/members.yaml#/components/schemas/MaskedMember
        status:
          $ref: '#/components/schemas/CoworkerStatus'
    CoworkerStatus:
      type: string
      enum:
        - NONE
        - SENT
        - RECEIVED
        - COWORKER
    CoworkerTask:
      type: object
      required:
        - id
        - profileId
        - start
        - end
      properties:
        id:
          type: integer
          format: int64
          example: 1
        profileId:
          type: integer
          format: int64
          example: 1
        start:
          type: string
          format: date
        end:
          type: string
          format: date
