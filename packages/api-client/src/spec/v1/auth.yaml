paths:
  /api/v1/auth/otp/send:
    post:
      operationId: sendOtp
      tags:
        - Auth
      security: []
      summary: 인증코드 발송
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendCodeRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ../_shared.yaml#/components/schemas/ApiSuccessResponseBase
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/SendOtpResponse'
        '400':
          description: |
            - `C001` 유효하지 않은 입력값입니다
          content:
            application/json:
              schema:
                $ref: ../_shared.yaml#/components/schemas/ApiErrorResponse
        '429':
          description: |
            - `A001` 일일 발송 한도를 초과했습니다
            - `A002` 재전송 대기 시간이 지나지 않았습니다
          content:
            application/json:
              schema:
                $ref: ../_shared.yaml#/components/schemas/ApiErrorResponse
  /api/v1/auth/otp/verify:
    post:
      operationId: verifyOtp
      tags:
        - Auth
      security: []
      summary: 인증코드 검증
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyCodeRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ../_shared.yaml#/components/schemas/ApiSuccessResponseBase
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        oneOf:
                          - $ref: '#/components/schemas/VerifyOtpLoginResponse'
                          - $ref: '#/components/schemas/VerifyOtpSignupResponse'
                        discriminator:
                          propertyName: registered
        '400':
          description: |
            - `C001` 유효하지 않은 입력값입니다
            - `A003` 유효하지 않은 인증번호입니다
            - `A004` 인증번호가 만료되었습니다
            - `A005` 인증 시도 횟수를 초과했습니다
          content:
            application/json:
              schema:
                $ref: ../_shared.yaml#/components/schemas/ApiErrorResponse
  /api/v1/auth/refresh:
    post:
      operationId: refreshToken
      tags:
        - Auth
      security:
        - cookieAuth: []
      summary: 토큰 갱신
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ../_shared.yaml#/components/schemas/ApiSuccessResponseBase
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/RefreshTokenResponse'
        '401':
          description: |
            - `A006` 유효하지 않은 리프레시 토큰입니다
          content:
            application/json:
              schema:
                $ref: ../_shared.yaml#/components/schemas/ApiErrorResponse
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags:
        - Auth
      summary: 로그아웃
      responses:
        '200':
          description: OK
components:
  securitySchemes:
    # Access Token
    bearerAuth:
      type: http
      scheme: bearer # https://datatracker.ietf.org/doc/html/rfc6750#section-6.1.1
      bearerFormat: JWT # https://datatracker.ietf.org/doc/html/rfc7519#section-4.1
      # OpenAPI 표준은 securityScheme ↔ token payload schema 의 의미 link 메커니즘 부재 →
      # `x-` extension (OAS §4.9 Specification Extensions) 으로 명시. JwtPayload 가 같은 파일에
      # 정의되어 있어 internal ref 로 self-contained.
      x-jwt-payload-schema:
        $ref: '#/components/schemas/JwtPayload'
      description: |
        JWT Access Token (15분 만료).

        헤더 형식: `Authorization: Bearer <jwt>` (RFC 6750)

        Payload 구조: [`JwtPayload`](#/components/schemas/JwtPayload) 참조 (RFC 7519 표준 claims + Morton custom claims).

        Lifecycle:
        - 발급: `POST /api/v1/auth/otp/verify` 응답의 `accessToken`
        - 갱신: `POST /api/v1/auth/refresh` (cookieAuth 사용)

        에러:
        - `A007` 유효하지 않은 액세스 토큰입니다 (401)
        - `A008` 세션이 만료되었습니다 (401)

    # Refresh Token — opaque (RFC 6749 의 OAuth2 refresh_token 패턴)
    cookieAuth:
      type: apiKey
      in: cookie
      name: refreshToken # https://datatracker.ietf.org/doc/html/rfc6749#section-1.5

  schemas:
    SendCodeRequest:
      type: object
      required:
        - phone
      properties:
        phone:
          type: string
          pattern: \d{10,11}
    VerifyCodeRequest:
      type: object
      required:
        - phone
        - code
      properties:
        phone:
          type: string
          pattern: \d{10,11}
        code:
          type: string
          pattern: \d{6}
    SendOtpResponse:
      type: object
      required:
        - expiresAt
      properties:
        expiresAt:
          type: string
          format: date-time
    VerifyOtpLoginResponse:
      type: object
      required:
        - registered
        - accessToken
        - refreshToken
      properties:
        registered:
          type: boolean
          const: true
        accessToken:
          type: string
        refreshToken:
          type: string
    VerifyOtpSignupResponse:
      type: object
      required:
        - registered
        - signupToken
      properties:
        registered:
          type: boolean
          const: false
        signupToken:
          type: string
    RefreshTokenResponse:
      type: object
      required:
        - accessToken
        - refreshToken
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string

    # JWT Access Token 의 payload 구조 — bearerAuth scheme 의 token 디코딩 결과.
    # OpenAPI 표준은 bearerFormat: JWT 만 hint, payload schema 표현 메커니즘 없음 →
    # 별도 schema 로 정의해 BE/FE contract 동기화.
    # 사용처: _shared.yaml 의 bearerAuth.description 의 markdown link, FE token 디코딩 type.
    JwtPayload:
      type: object
      required:
        - sub
        - role
        - exp
        - iat
      properties:
        # RFC 7519 표준 Registered Claims
        sub: # https://datatracker.ietf.org/doc/html/rfc7519#section-4.1.2
          type: string
          description: Subject — Member ID
          example: '12345'
        exp: # https://datatracker.ietf.org/doc/html/rfc7519#section-4.1.4
          type: integer
          format: int64
          description: Expiration Time — 만료 unix timestamp (15분 후)
          example: 1709251200
        iat: # https://datatracker.ietf.org/doc/html/rfc7519#section-4.1.6
          type: integer
          format: int64
          description: Issued At — 발급 unix timestamp
          example: 1709250300
        iss: # https://datatracker.ietf.org/doc/html/rfc7519#section-4.1.1
          type: string
          description: Issuer
          example: bconnect.to

        # Morton Private Claims (RFC 7519 §4.3)
        # https://datatracker.ietf.org/doc/html/rfc7519#section-4.3
        role:
          $ref: ../v1/members.yaml#/components/schemas/Role
