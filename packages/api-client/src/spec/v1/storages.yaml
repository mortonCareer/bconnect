paths:
  /api/v1/storages:
    get:
      operationId: getStorages
      tags:
        - Storages
      summary: 저장소 목록 조회
      parameters:
        - name: type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/StorageType'
        - name: projectId
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ../_shared.yaml#/components/schemas/ApiSuccessResponseBase
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Storage'
    post:
      operationId: createStorage
      tags:
        - Storages
      summary: 저장소 생성
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStorageRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ../_shared.yaml#/components/schemas/ApiSuccessResponseBase
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: integer
                        format: int64
        '400':
          description: |
            - `C001` 유효하지 않은 입력값입니다
          content:
            application/json:
              schema:
                $ref: ../_shared.yaml#/components/schemas/ApiErrorResponse
  /api/v1/storages/{storageId}:
    get:
      operationId: getStorage
      tags:
        - Storages
      summary: 저장소 상세 조회
      parameters:
        - name: storageId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ../_shared.yaml#/components/schemas/ApiSuccessResponseBase
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/Storage'
    delete:
      operationId: deleteStorage
      tags:
        - Storages
      summary: 저장소 삭제
      parameters:
        - name: storageId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
  /api/v1/storages/{storageId}/attachments:
    post:
      operationId: addStorageAttachments
      tags:
        - Storages
      summary: 저장소에 첨부 추가
      parameters:
        - name: storageId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddStorageAttachmentsRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ../_shared.yaml#/components/schemas/ApiSuccessResponseBase
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/Storage'
        '400':
          description: |
            - `C001` 유효하지 않은 입력값입니다
          content:
            application/json:
              schema:
                $ref: ../_shared.yaml#/components/schemas/ApiErrorResponse
components:
  schemas:
    StorageType:
      type: string
      enum:
        - PROJECT
        - MEMBER
    Storage:
      type: object
      required:
        - id
        - type
        - title
        - attachments
        - createdAt
        - modifiedAt
      properties:
        id:
          type: integer
          format: int64
        type:
          $ref: '#/components/schemas/StorageType'
        projectId:
          type:
            - integer
            - 'null'
          format: int64
        memberId:
          type:
            - integer
            - 'null'
          format: int64
        title:
          type: string
        attachments:
          type: array
          items:
            $ref: '../v1/attachments.yaml#/components/schemas/AttachmentMeta'
        createdAt:
          type: string
          format: date-time
        modifiedAt:
          type: string
          format: date-time
    CreateStorageRequest:
      type: object
      required:
        - type
        - title
      properties:
        type:
          $ref: '#/components/schemas/StorageType'
        projectId:
          type:
            - integer
            - 'null'
          format: int64
        title:
          type: string
    AddStorageAttachmentsRequest:
      type: object
      required:
        - attachmentIds
      properties:
        attachmentIds:
          type: array
          minItems: 1
          items:
            type: integer
            format: int64
