paths:
  /api/v1/members:
    get:
      operationId: getMembers
      tags:
        - Members
      summary: 회원 목록 조회 (ADMIN)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ../_shared/components/schemas/ApiSuccessResponseBase.yaml
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Member'
    post:
      operationId: registerMember
      tags:
        - Members
      security: []
      summary: 회원가입
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterMemberRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ../_shared/components/schemas/ApiSuccessResponseBase.yaml
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: integer
                        format: int64
        '400':
          description: |
            - `C001` 유효하지 않은 입력값입니다
            - `A009` 유효하지 않은 가입 토큰입니다
            - `A010` 가입 토큰이 만료되었습니다
          content:
            application/json:
              schema:
                $ref: ../_shared/components/schemas/ApiErrorResponse.yaml
  /api/v1/members/roles:
    get:
      operationId: getRoles
      tags:
        - Members
      security: []
      summary: 역할 목록 조회
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ../_shared/components/schemas/ApiSuccessResponseBase.yaml
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Role'
  /api/v1/members/check-username:
    get:
      operationId: checkUsername
      tags:
        - Members
      security: []
      summary: 사용자명 중복 확인
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ../_shared/components/schemas/ApiSuccessResponseBase.yaml
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/CheckUsernameResponse'
        '400':
          description: |
            - `C001` 유효하지 않은 입력값입니다
          content:
            application/json:
              schema:
                $ref: ../_shared/components/schemas/ApiErrorResponse.yaml
  /api/v1/members/me:
    get:
      operationId: getMyMember
      tags:
        - Members
      summary: 내 정보 조회
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ../_shared/components/schemas/ApiSuccessResponseBase.yaml
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/Member'
    put:
      operationId: updateMyMember
      tags:
        - Members
      summary: 내 정보 수정
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberRequest'
      responses:
        '200':
          description: OK
        '400':
          description: |
            - `C001` 유효하지 않은 입력값입니다
          content:
            application/json:
              schema:
                $ref: ../_shared/components/schemas/ApiErrorResponse.yaml
    delete:
      operationId: withdraw
      tags:
        - Members
      summary: 회원 탈퇴
      responses:
        '200':
          description: OK
components:
  schemas:
    Member:
      type: object
      required:
        - id
        - username
        - name
        - phone
        - role
        - createdAt
        - modifiedAt
      properties:
        id:
          type: integer
          format: int64
          example: 1
        username:
          type: string
        name:
          type: string
        phone:
          type: string
        picture:
          type:
            - string
            - 'null'
        role:
          $ref: '#/components/schemas/Role'
        createdAt:
          type: string
          format: date-time
        modifiedAt:
          type: string
          format: date-time
    RegisterMemberRequest:
      type: object
      required:
        - signupToken
        - username
        - name
        - role
      properties:
        signupToken:
          type: string
        username:
          type: string
        name:
          type: string
        picture:
          type:
            - string
            - 'null'
          format: uri
        role:
          $ref: '#/components/schemas/Role'
    UpdateMemberRequest:
      type: object
      required:
        - name
        - role
      properties:
        name:
          type: string
        picture:
          type:
            - string
            - 'null'
          format: uri
        role:
          $ref: '#/components/schemas/Role'
    Role:
      type: string
      enum:
        - GUEST
        - CLIENT
        - ARCHITECT
        - CONTRACTOR
        - FOREMAN
        - SKILLED
        - SEMI_SKILLED
        - HELPER
        - ADMIN
    MaskedMember:
      type: object
      required:
        - id
        - username
        - name
        - createdAt
        - modifiedAt
      properties:
        id:
          type: integer
          format: int64
          example: 1
        username:
          type: string
        name:
          type: string
        picture:
          type:
            - string
            - 'null'
        createdAt:
          type: string
          format: date-time
        modifiedAt:
          type: string
          format: date-time
    CheckUsernameResponse:
      type: object
      required:
        - available
      properties:
        available:
          type: boolean
