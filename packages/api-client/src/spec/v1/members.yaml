paths:
  /api/v1/members:
    get:
      operationId: getMembers
      tags:
        - Members
      summary: 회원 목록 조회 (ADMIN)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ../_shared.yaml#/components/schemas/ApiSuccessResponseBase
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Member'
    post:
      operationId: registerMember
      tags:
        - Members
      security: []
      summary: 회원가입
      description: 회원가입 + 자동 로그인
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterMemberRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ../_shared.yaml#/components/schemas/ApiSuccessResponseBase
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/RegisterMemberResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterMemberValidationError'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterMemberConflictError'
  /api/v1/members/roles:
    get:
      operationId: getRoles
      tags:
        - Members
      security: []
      summary: 역할 목록 조회
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ../_shared.yaml#/components/schemas/ApiSuccessResponseBase
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Role'
  /api/v1/members/check-username:
    get:
      operationId: checkUsername
      tags:
        - Members
      security: []
      summary: 사용자명 중복 확인
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ../_shared.yaml#/components/schemas/ApiSuccessResponseBase
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/CheckUsernameResponse'
        '400':
          description: |
            - `C001` 유효하지 않은 입력값입니다
          content:
            application/json:
              schema:
                $ref: ../_shared.yaml#/components/schemas/ApiErrorResponse
  /api/v1/members/me:
    get:
      operationId: getMyMember
      tags:
        - Members
      summary: 내 정보 조회
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ../_shared.yaml#/components/schemas/ApiSuccessResponseBase
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/Member'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: ../_shared.yaml#/components/schemas/NotFoundError
    put:
      operationId: updateMyMember
      tags:
        - Members
      summary: 내 정보 수정
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberRequest'
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: ../_shared.yaml#/components/schemas/ValidationError
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: ../_shared.yaml#/components/schemas/NotFoundError
    delete:
      operationId: withdraw
      tags:
        - Members
      summary: 회원 탈퇴
      responses:
        '200':
          description: OK
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: ../_shared.yaml#/components/schemas/NotFoundError
components:
  schemas:
    Member:
      type: object
      required:
        - id
        - username
        - name
        - phone
        - role
        - createdAt
        - modifiedAt
      properties:
        id:
          type: integer
          format: int64
          example: 1
        username:
          type: string
        name:
          type: string
        phone:
          type: string
        picture:
          type:
            - string
            - 'null'
          format: image-url
          example: https://placehold.co/200x200
        role:
          $ref: '#/components/schemas/Role'
        createdAt:
          type: string
          format: date-time
        modifiedAt:
          type: string
          format: date-time
    RegisterMemberRequest:
      type: object
      required:
        - signupToken
        - username
        - name
        - role
      properties:
        signupToken:
          type: string
        username:
          type: string
        name:
          type: string
        picture:
          type:
            - string
            - 'null'
          format: image-url
          example: https://placehold.co/200x200
        role:
          $ref: '#/components/schemas/Role'
    RegisterMemberResponse:
      type: object
      required:
        - accessToken
        - refreshToken
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
    UpdateMemberRequest:
      type: object
      required:
        - name
        - role
      properties:
        name:
          type: string
        picture:
          type:
            - string
            - 'null'
          format: image-url
          example: https://placehold.co/200x200
        role:
          $ref: '#/components/schemas/Role'
    Role:
      type: string
      enum:
        - GUEST
        - CLIENT
        - ARCHITECT
        - CONTRACTOR
        - FOREMAN
        - SKILLED
        - SEMI_SKILLED
        - HELPER
        - ADMIN
    MaskedMember:
      type: object
      required:
        - id
        - username
        - name
        - createdAt
        - modifiedAt
      properties:
        id:
          type: integer
          format: int64
          example: 1
        username:
          type: string
        name:
          type: string
        picture:
          type:
            - string
            - 'null'
          format: image-url
          example: https://placehold.co/200x200
        createdAt:
          type: string
          format: date-time
        modifiedAt:
          type: string
          format: date-time
    CheckUsernameResponse:
      type: object
      required:
        - available
      properties:
        available:
          type: boolean
    RegisterMemberValidationError:
      allOf:
        - $ref: ../_shared.yaml#/components/schemas/ApiErrorResponse
        - type: object
          properties:
            error:
              type: object
              properties:
                code:
                  type: string
                  enum: [C001, A009, A010]
    RegisterMemberConflictError:
      allOf:
        - $ref: ../_shared.yaml#/components/schemas/ApiErrorResponse
        - type: object
          properties:
            error:
              type: object
              properties:
                code:
                  type: string
                  enum: [M001, M002]
