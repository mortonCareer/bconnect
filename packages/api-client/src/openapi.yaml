openapi: 3.0.3
info:
  title: Morton API
  version: 1.0.0

servers:
  - url: http://localhost:8080

paths:
  # =====================
  # Auth Endpoints
  # =====================
  /api/v1/auth/otp/send:
    post:
      operationId: sendOtp
      tags: [Auth]
      summary: Send SMS OTP code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendCodeRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendCodeResponse'

  /api/v1/auth/otp/verify:
    post:
      operationId: verifyOtp
      tags: [Auth]
      summary: Verify OTP code and get tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyCodeRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /api/v1/auth/refresh:
    post:
      operationId: refreshToken
      tags: [Auth]
      summary: Refresh access token using refresh token cookie
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'

  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: Logout and invalidate refresh token
      responses:
        '200':
          description: OK

  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      tags: [Auth]
      summary: Get current authenticated user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  # =====================
  # User Endpoints
  # =====================
  /api/v1/users:
    get:
      operationId: getUsers
      tags: [Users]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'

    post:
      operationId: createUser
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /api/v1/users/{userId}:
    get:
      operationId: getUser
      tags: [Users]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

    put:
      operationId: updateUser
      tags: [Users]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

components:
  schemas:
    # =====================
    # Error Schemas
    # =====================
    ErrorCode:
      type: string
      enum:
        # Auth errors
        - INVALID_PHONE
        - OTP_RATE_LIMIT
        - OTP_INVALID
        - OTP_EXPIRED
        - OTP_MAX_ATTEMPTS
        - UNAUTHORIZED
        - TOKEN_EXPIRED
        - TOKEN_INVALID
        # User errors
        - USER_NOT_FOUND
        - USERNAME_TAKEN
        - USERNAME_INVALID
        # Validation errors
        - VALIDATION_ERROR
        - BAD_REQUEST
        # Server errors
        - INTERNAL_ERROR

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: Human-readable error message
        details:
          type: object
          additionalProperties: true
          description: Additional error details (e.g., validation errors)

    # =====================
    # Auth Schemas
    # =====================
    SendCodeRequest:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
          description: Phone number in E.164 format (e.g., +821012345678)

    SendCodeResponse:
      type: object
      properties:
        expiresAt:
          type: string
          format: date-time
          description: When the verification code expires

    VerifyCodeRequest:
      type: object
      required: [phone, code]
      properties:
        phone:
          type: string
        code:
          type: string
          description: 6-digit verification code

    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
        isNew:
          type: boolean
          description: True if user was newly registered
        user:
          $ref: '#/components/schemas/User'

    RefreshResponse:
      type: object
      properties:
        accessToken:
          type: string

    # =====================
    # User Schemas
    # =====================
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        phone:
          type: string
        username:
          type: string
        name:
          type: string
        picture:
          type: string
        role:
          type: string
          enum: [TECHNICIAN, COMPANY, ADMIN]
          nullable: true
          description: User role (null for new users who haven't selected a role)

    CreateUserRequest:
      type: object
      required: [username, name]
      properties:
        username:
          type: string
        name:
          type: string

    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
