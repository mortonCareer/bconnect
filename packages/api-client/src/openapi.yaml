components:
  schemas:
    Address:
      type: object
      properties:
        zipcode:
          type: string
          minLength: 1
          pattern: "\\d{5}"
        bcode:
          type: string
          minLength: 1
          pattern: "\\d{10}"
        state:
          $ref: "#/components/schemas/Region"
        city:
          type: string
          minLength: 1
        street:
          type: string
          minLength: 1
        detail:
          type: string
        latitude:
          type: number
        longitude:
          type: number
      required:
      - bcode
      - city
      - latitude
      - longitude
      - state
      - street
      - zipcode
    Region:
      type: string
      enum:
      - 서울
      - 부산
      - 대구
      - 인천
      - 대전
      - 울산
      - 세종특별자치시
      - 경기
      - 강원특별자치도
      - 충북
      - 충남
      - 전북특별자치도
      - 전남광주통합특별시
      - 경북
      - 경남
      - 제주특별자치도
    TaskProgress:
      type: string
      enum:
      - TODO
      - IN_PROGRESS
      - COMPLETED
    Trade:
      type: string
      enum:
      - DESIGN
      - DEMOLITION
      - ELECTRICAL
      - PLUMBING
      - MECHANICAL
      - MASONRY
      - CARPENTRY
      - GLAZING
      - WATERPROOFING
      - PLASTERING
      - INSULATION
      - TILING
      - GROUTING
      - PAINTING
      - WALLPAPER
      - FILM_SHEET
      - HARDWOOD
      - VINYL
      - SINK
      - FURNITURE
      - AIR_CONDITIONING
      - HOISTING
      - TRANSPORT
      - CLEANING
      - GENERAL_LABOR
      - HOME_REPAIR
      - BATHROOM
      - DISINFECTION
    UpdateWorkerTaskRequest:
      type: object
      properties:
        trades:
          type: array
          items:
            $ref: "#/components/schemas/Trade"
          minItems: 1
          uniqueItems: true
        start:
          type: string
          format: date
        end:
          type: string
          format: date
        progress:
          $ref: "#/components/schemas/TaskProgress"
        title:
          type: string
          minLength: 1
        memo:
          type: string
        company:
          type: string
        address:
          $ref: "#/components/schemas/Address"
      required:
      - end
      - progress
      - start
      - title
      - trades
    ApiResponseVoid:
      type: object
      properties:
        success:
          type: boolean
        error:
          $ref: "#/components/schemas/ExceptionCode"
        data: {}
    ExceptionCode:
      type: object
      properties:
        message:
          type: string
        status:
          $ref: "#/components/schemas/HttpStatus"
        code:
          type: string
    HttpStatus:
      type: string
      enum:
      - 100 CONTINUE
      - 101 SWITCHING_PROTOCOLS
      - 102 PROCESSING
      - 103 EARLY_HINTS
      - 200 OK
      - 201 CREATED
      - 202 ACCEPTED
      - 203 NON_AUTHORITATIVE_INFORMATION
      - 204 NO_CONTENT
      - 205 RESET_CONTENT
      - 206 PARTIAL_CONTENT
      - 207 MULTI_STATUS
      - 208 ALREADY_REPORTED
      - 226 IM_USED
      - 300 MULTIPLE_CHOICES
