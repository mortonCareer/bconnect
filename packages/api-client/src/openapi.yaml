openapi: 3.0.3
info:
  title: Bconnect API
  description: 인테리어 종사자를 위한 하도급 섭외 · 관리 플랫폼 '품앗이'의 REST API
  version: 0.2.0

servers:
  - url: http://localhost:8080
    description: 로컬 개발 서버
  - url: https://api.bconnect.to
    description: 프로덕션 서버

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: 인증 및 토큰 관리
  - name: Members
    description: 회원 정보 관리
  - name: Feeds
    description: 피드 관리
  - name: Posts
    description: 게시글 관리
  - name: Tasks
    description: 작업 사항 관리
  - name: Profiles
    description: 기술자 프로필 관리
  - name: Credentials
    description: 인증뱃지(자격/면허/증명서) 관리
  - name: Coworkers
    description: 동료 관계 관리
  - name: CoworkerRequests
    description: 동료 요청 관리
  - name: Recommendations
    description: 추천서 관리
  - name: Chats
    description: 채팅 관리

externalDocs:
  description: 개발 문서 (Notion)
  url: https://www.notion.so/morton-so/2dc965d2888b80ac9b72ca4d22812b12

paths:
  # =====================
  # Auth Endpoints
  # =====================
  /api/v1/auth/otp/send:
    post:
      operationId: sendOtp
      tags: [Auth]
      security: []
      summary: 인증코드 발송
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendCodeRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendOtpResponse'
        '400':
          description: |
            - `C001` 유효하지 않은 입력값입니다
        '429':
          description: |
            - `A001` 일일 발송 한도를 초과했습니다
            - `A002` 재전송 대기 시간이 지나지 않았습니다

  /api/v1/auth/otp/verify:
    post:
      operationId: verifyOtp
      tags: [Auth]
      security: []
      summary: 인증코드 검증
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyCodeRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/VerifyOtpLoginResponse'
                  - $ref: '#/components/schemas/VerifyOtpSignupResponse'
                discriminator:
                  propertyName: registered
        '400':
          description: |
            - `C001` 유효하지 않은 입력값입니다
            - `A003` 유효하지 않은 인증번호입니다
            - `A004` 인증번호가 만료되었습니다
            - `A005` 인증 시도 횟수를 초과했습니다

  /api/v1/auth/refresh:
    post:
      operationId: refreshToken
      tags: [Auth]
      security:
        - cookieAuth: []
      summary: 토큰 갱신
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
        '401':
          description: |
            - `A006` 유효하지 않은 리프레시 토큰입니다

  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: 로그아웃
      responses:
        '200':
          description: OK

  # =====================
  # Member Endpoints
  # =====================
  /api/v1/members:
    get:
      operationId: getMembers
      tags: [Members]
      summary: (ADMIN) 회원 목록 조회
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member'

    post:
      operationId: registerMember
      tags: [Members]
      security: []
      summary: 회원가입
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterMemberRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: integer
                format: int64
        '400':
          description: |
            - `C001` 유효하지 않은 입력값입니다
            - `A009` 유효하지 않은 가입 토큰입니다
            - `A010` 가입 토큰이 만료되었습니다

  /api/v1/members/check-username:
    get:
      operationId: checkUsername
      tags: [Members]
      security: []
      summary: 사용자명 중복 확인
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckUsernameResponse'
        '400':
          description: |
            - `C001` 유효하지 않은 입력값입니다

  /api/v1/members/me:
    get:
      operationId: getMyMember
      tags: [Members]
      summary: 내 정보 조회
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'

    put:
      operationId: updateMyMember
      tags: [Members]
      summary: 내 정보 수정
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberRequest'
      responses:
        '200':
          description: OK
        '400':
          description: |
            - `C001` 유효하지 않은 입력값입니다

    delete:
      operationId: withdraw
      tags: [Members]
      summary: 회원 탈퇴
      responses:
        '200':
          description: OK

  # =====================
  # Feed Endpoints
  # =====================
  /api/v1/feeds:
    get:
      operationId: getFeeds
      tags: [Feeds]
      security: []
      summary: 피드 목록 조회
      parameters:
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: reverse
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedOffsetPage'

  /api/v1/feeds/{feedId}:
    get:
      operationId: getFeed
      tags: [Feeds]
      security: []
      summary: 피드 단건 조회
      parameters:
        - name: feedId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feed'

  # =====================
  # Post Endpoints
  # =====================
  /api/v1/posts:
    post:
      operationId: createPost
      tags: [Posts]
      summary: 게시글 생성
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: integer
                format: int64
        '400':
          description: |
            - `C001` 유효하지 않은 입력값입니다

  /api/v1/posts/{postId}:
    parameters:
      - name: postId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    put:
      operationId: updatePost
      tags: [Posts]
      summary: 게시글 수정
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePostRequest'
      responses:
        '200':
          description: OK
        '400':
          description: |
            - `C001` 유효하지 않은 입력값입니다

    delete:
      operationId: deletePost
      tags: [Posts]
      summary: 게시글 삭제
      responses:
        '200':
          description: OK

  # =====================
  # Task Endpoints
  # =====================
  /api/v1/tasks:
    get:
      operationId: getMyTasks
      tags: [Tasks]
      summary: 내 작업 목록 조회
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'

    post:
      operationId: createTask
      tags: [Tasks]
      summary: 작업 생성
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: integer
                format: int64
        '400':
          description: |
            - `C001` 유효하지 않은 입력값입니다

  /api/v1/tasks/{taskId}:
    parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    put:
      operationId: updateTask
      tags: [Tasks]
      summary: 작업 수정
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: OK
        '400':
          description: |
            - `C001` 유효하지 않은 입력값입니다

    delete:
      operationId: deleteTask
      tags: [Tasks]
      summary: 작업 삭제
      responses:
        '200':
          description: OK

  # =====================
  # Profile Endpoints
  # =====================
  /api/v1/profiles:
    get:
