      operationId: getReceivedRecommendations
      tags: [Recommendations]
      security: []
      summary: 받은 추천서 목록 조회
      parameters:
        - name: profileId
          in: query
          required: true
          description: 프로필 ID
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Recommendation'

  /api/v1/recommendations/sent:
