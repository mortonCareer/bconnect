  /api/v1/profiles/me:
    put:
      operationId: updateMyProfile
      tags: [Profiles]
      summary: 내 프로필 수정
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: OK
        '400':
          description: |
            - `C001` 유효하지 않은 입력값입니다

    delete:
      operationId: deleteMyProfile
      tags: [Profiles]
      summary: 내 프로필 삭제
      responses:
        '200':
          description: OK

  /api/v1/profiles/me/about:
    put:
      operationId: updateMyProfileAbout
      tags: [Profiles]
      summary: 내 소개 수정
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileAboutRequest'
      responses:
        '200':
          description: OK

  # =====================
  # Credential Endpoints
  # =====================
  /api/v1/credentials/types:
    get:
      operationId: getCredentialTypes
      tags: [Credentials]
      security: []
      summary: 인증뱃지 타입 목록 조회
