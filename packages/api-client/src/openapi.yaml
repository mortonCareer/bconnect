        name:
          type: string
          minLength: 1
        picture:
          type: string
        role:
          $ref: "#/components/schemas/Role"
      required:
      - name
      - role
    CreateTaskRequest:
      type: object
      properties:
        company:
          type: string
          minLength: 1
        address:
