openapi: 3.0.3
info:
  title: Morton API
  version: 1.0.0

servers:
  - url: http://localhost:8080

security:
  - bearerAuth: []

paths:
  # =====================
  # Auth Endpoints
  # =====================
  /api/v1/auth/otp/send:
    post:
      operationId: sendOtp
      tags: [Auth]
      security: []
      summary: SMS 인증코드를 발송합니다
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendCodeRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendOtpResponse'
        '400':
          description: |
            - `C001` 유효하지 않은 입력값입니다
        '429':
          description: |
            - `A001` 일일 발송 한도를 초과했습니다
            - `A002` 재전송 대기 시간이 지나지 않았습니다

  /api/v1/auth/otp/verify:
    post:
      operationId: verifyOtp
      tags: [Auth]
      security: []
      summary: 인증코드를 검증합니다 (로그인 또는 회원가입 분기)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyCodeRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/VerifyOtpLoginResponse'
                  - $ref: '#/components/schemas/VerifyOtpSignupResponse'
                discriminator:
                  propertyName: registered
        '400':
          description: |
            - `C001` 유효하지 않은 입력값입니다
            - `A003` 유효하지 않은 인증번호입니다
            - `A004` 인증번호가 만료되었습니다
            - `A005` 인증 시도 횟수를 초과했습니다

  /api/v1/auth/refresh:
    post:
      operationId: refreshToken
      tags: [Auth]
      security: []
      summary: 리프레시 토큰으로 액세스 토큰을 갱신합니다
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
        '401':
          description: |
            - `A006` 유효하지 않은 리프레시 토큰입니다

  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: 로그아웃하고 리프레시 토큰을 무효화합니다
      responses:
        '200':
          description: OK

  /api/v1/auth/me:
    get:
      operationId: getCurrentMember
      tags: [Auth]
      summary: 현재 로그인한 회원 정보를 조회합니다
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'

  # =====================
  # Member Endpoints
  # =====================
  /api/v1/members:
    get:
      operationId: getMembers
      tags: [Members]
      summary: 회원 목록을 조회합니다
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member'

    post:
      operationId: registerMember
      tags: [Members]
      security: []
      summary: 새 회원을 등록합니다
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterMemberRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          description: |
            - `C001` 유효하지 않은 입력값입니다
            - `A009` 유효하지 않은 가입 토큰입니다
            - `A010` 가입 토큰이 만료되었습니다

  /api/v1/members/{memberId}:
    get:
      operationId: getMember
      tags: [Members]
      summary: 회원 정보를 조회합니다
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'

    put:
      operationId: updateMember
      tags: [Members]
      summary: 회원 정보를 수정합니다
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          description: |
            - `C001` 유효하지 않은 입력값입니다

  # =====================
  # Post Endpoints
  # =====================
  /api/v1/posts:
    get:
      operationId: getPosts
      tags: [Posts]
      summary: 게시글 목록을 조회합니다 (필터, 커서 페이지네이션)
      parameters:
        - name: authorId
          in: query
          required: false
          description: 작성자 ID로 필터링
          schema:
            type: integer
            format: int64
        - name: taskId
          in: query
          required: false
          description: 작업 ID로 필터링
          schema:
            type: integer
            format: int64
        - name: trade
          in: query
          required: false
          description: 시공분야로 필터링
          schema:
            $ref: '#/components/schemas/Trade'
        - name: minExperience
          in: query
          required: false
          description: 최소 경력 (년)
          schema:
            type: integer
        - name: maxExperience
          in: query
          required: false
          description: 최대 경력 (년)
          schema:
            type: integer
        - name: cursor
          in: query
          required: false
          description: 페이지네이션 커서
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: 페이지 크기 (기본값 20)
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostPage'

    post:
      operationId: createPost
      tags: [Posts]
      summary: 새 게시글을 작성합니다
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          description: |
            - `C001` 유효하지 않은 입력값입니다

  /api/v1/posts/{postId}:
    get:
      operationId: getPost
      tags: [Posts]
      summary: 게시글을 조회합니다
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'

    put:
      operationId: updatePost
      tags: [Posts]
      summary: 게시글을 수정합니다
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePostRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          description: |
            - `C001` 유효하지 않은 입력값입니다

    delete:
      operationId: deletePost
      tags: [Posts]
      summary: 게시글을 삭제합니다
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: No Content

  # =====================
  # Task Endpoints
  # =====================
  /api/v1/tasks:
    get:
      operationId: getTasks
      tags: [Tasks]
      summary: 작업 목록을 조회합니다
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'

    post:
      operationId: createTask
      tags: [Tasks]
      summary: 새 작업을 생성합니다
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: |
            - `C001` 유효하지 않은 입력값입니다

  /api/v1/tasks/{taskId}:
    get:
      operationId: getTask
      tags: [Tasks]
      summary: 작업을 조회합니다
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'

    put:
      operationId: updateTask
      tags: [Tasks]
      summary: 작업을 수정합니다
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: |
            - `C001` 유효하지 않은 입력값입니다

    delete:
      operationId: deleteTask
      tags: [Tasks]
      summary: 작업을 삭제합니다
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: No Content

  # =====================
  # Chat Endpoints
  # =====================
  /api/v1/chats:
    get:
      operationId: getMyChats
      tags: [Chats]
      summary: 내 채팅방 목록을 조회합니다 (커서 페이지네이션)
      parameters:
        - name: cursor
          in: query
          required: false
          description: 페이지네이션 커서
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: 페이지 크기 (기본값 20)
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatPage'

    post:
      operationId: createChat
      tags: [Chats]
      summary: 1:1 채팅방을 생성합니다 (기존 채팅방이 있으면 재사용)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChatRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chat'
        '400':
          description: |
            - `C001` 유효하지 않은 입력값입니다
            - `CH003` 자기 자신에게 채팅을 보낼 수 없습니다

  /api/v1/chats/unread-count:
    get:
      operationId: getUnreadCount
      tags: [Chats]
      summary: 전체 안 읽은 메시지 수를 조회합니다
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadCountResponse'

  /api/v1/chats/{chatId}:
    get:
      operationId: getChat
      tags: [Chats]
      summary: 채팅방을 조회합니다
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chat'

  /api/v1/chats/{chatId}/messages:
    get:
      operationId: getChatMessages
      tags: [Chats]
      summary: 채팅방의 메시지 목록을 조회합니다 (역방향 커서 페이지네이션)
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: before
          in: query
          required: false
          description: 이 커서 이전의 메시지를 조회
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: 페이지 크기 (기본값 30)
          schema:
            type: integer
            default: 30
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePage'

    post:
      operationId: sendMessage
      tags: [Chats]
      summary: 채팅방에 메시지를 전송합니다
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: |
            - `C001` 유효하지 않은 입력값입니다
        '403':
          description: |
            - `CH002` 채팅방 참여 권한이 없습니다
        '404':
          description: |
            - `CH001` 채팅방을 찾을 수 없습니다

  /api/v1/chats/{chatId}/read:
    post:
      operationId: markChatAsRead
      tags: [Chats]
      summary: 채팅방을 읽음 처리합니다
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: No Content
        '403':
          description: |
            - `CH002` 채팅방 참여 권한이 없습니다
        '404':
          description: |
            - `CH001` 채팅방을 찾을 수 없습니다

  # =====================
  # Profile Endpoints
  # =====================
  /api/v1/profiles/me:
    get:
      operationId: getMyProfile
      tags: [Profiles]
      summary: 내 프로필을 조회합니다
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'

    put:
      operationId: updateMyProfile
      tags: [Profiles]
      summary: 내 프로필을 수정합니다
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '204':
          description: No Content
        '400':
          description: |
            - `C001` 유효하지 않은 입력값입니다

  /api/v1/profiles/{profileId}:
    get:
      operationId: getProfile
      tags: [Profiles]
      summary: 프로필을 조회합니다
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # =====================
    # Common
    # =====================
    CursorPageMeta:
      type: object
      required: [hasMore]
      properties:
        nextCursor:
          type: string
          nullable: true
          description: 다음 페이지 커서 (마지막 페이지면 null)
        hasMore:
          type: boolean
          description: 다음 페이지 존재 여부

    Address:
      type: object
      properties:
        zipcode:
          type: string
          pattern: '\d{5}'
        city:
          type: string
        state:
          type: string
        street:
          type: string
        detail:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double

    Role:
      type: string
      enum:
        - GUEST
        - ARCHITECT
        - CONTRACTOR
        - FOREMAN
        - WORKER
        - ADMIN

    Trade:
      type: string
      enum:
        # 기반 공정
        - DESIGN
        - DEMOLITION
        - ELECTRICAL
        - PLUMBING
        - MECHANICAL
        # 구조 공정
        - MASONRY
        - CARPENTRY
        - GLAZING
        - WATERPROOFING
        - PLASTERING
        - INSULATION
        # 마감 공정
        - TILING
        - GROUTING
        - PAINTING
        - WALLPAPER
        - FILM_SHEET
        - HARDWOOD
        - VINYL
        # 설치
        - SINK
        - FURNITURE
        - AIR_CONDITIONING
        # 현장지원
        - HOISTING
        - TRANSPORT
        - CLEANING
        - GENERAL_LABOR

    # =====================
    # Auth Schemas
    # =====================
    SendCodeRequest:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
          pattern: '\d{10,11}'

    SendOtpResponse:
      type: object
      properties:
        expiresAt:
          type: string
          format: date-time

    VerifyCodeRequest:
      type: object
      required: [phone, code]
      properties:
        phone:
          type: string
          pattern: '\d{10,11}'
        code:
          type: string
          pattern: '\d{6}'

    VerifyOtpLoginResponse:
      type: object
      required: [registered, accessToken, refreshToken]
      properties:
        registered:
          type: boolean
          enum: [true]
        accessToken:
          type: string
        refreshToken:
          type: string

    VerifyOtpSignupResponse:
      type: object
      required: [registered, signupToken]
      properties:
        registered:
          type: boolean
          enum: [false]
        signupToken:
          type: string

    RefreshTokenResponse:
      type: object
      properties:
        accessToken:
          type: string

    # =====================
    # Member Schemas
    # =====================
    Member:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        name:
          type: string
        phone:
          type: string
        picture:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        createdAt:
          type: string
          format: date-time
        modifiedAt:
          type: string
          format: date-time

    RegisterMemberRequest:
      type: object
      required: [username, name, phone, picture, role]
      properties:
        signupToken:
          type: string
        username:
          type: string
        name:
          type: string
        phone:
          type: string
          pattern: '\d{10,11}'
        picture:
          type: string
        role:
          $ref: '#/components/schemas/Role'

    UpdateMemberRequest:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
          pattern: '\d{10,11}'
        picture:
          type: string

    # =====================
    # Profile Schemas
    # =====================
    Profile:
      type: object
      properties:
        id:
          type: integer
          format: int64
        memberId:
          type: integer
          format: int64
        primaryTrade:
          $ref: '#/components/schemas/Trade'
        trades:
          type: array
          items:
            $ref: '#/components/schemas/Trade'
          uniqueItems: true
        experience:
          type: integer
        headline:
          type: string
          nullable: true
        about:
          type: string
          nullable: true
        address:
          $ref: '#/components/schemas/Address'
        createdAt:
          type: string
          format: date-time
        modifiedAt:
          type: string
          format: date-time

    UpdateProfileRequest:
      type: object
      properties:
        primaryTrade:
          $ref: '#/components/schemas/Trade'
        trades:
          type: array
          items:
            $ref: '#/components/schemas/Trade'
          uniqueItems: true
        experience:
          type: integer
        headline:
          type: string
        about:
          type: string
        address:
          $ref: '#/components/schemas/Address'

    # =====================
    # Post Schemas
    # =====================
    Post:
      type: object
      properties:
        id:
          type: integer
          format: int64
        authorId:
          type: integer
          format: int64
        taskId:
          type: integer
          format: int64
        images:
          type: array
          items:
            type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
        modifiedAt:
          type: string
          format: date-time

    PostPage:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Post'
        meta:
          $ref: '#/components/schemas/CursorPageMeta'

    CreatePostRequest:
      type: object
      required: [authorId, taskId, content]
      properties:
        authorId:
          type: integer
          format: int64
        taskId:
          type: integer
          format: int64
        images:
          type: array
          items:
            type: string
        content:
          type: string

    UpdatePostRequest:
      type: object
      properties:
        images:
          type: array
          items:
            type: string
        content:
          type: string

    # =====================
    # Task Schemas
    # =====================
    Task:
      type: object
      properties:
        id:
          type: integer
          format: int64
        company:
          type: string
        address:
          $ref: '#/components/schemas/Address'
        taskTitle:
          type: string
        eventTitle:
          type: string
        trades:
          type: array
          items:
            $ref: '#/components/schemas/Trade'
          uniqueItems: true
