openapi: 3.0.3
info:
  title: Morton API
  version: 1.0.0

servers:
  - url: http://localhost:8080

security:
  - bearerAuth: []

paths:
  # =====================
  # Auth Endpoints
  # =====================
  /api/v1/auth/otp/send:
    post:
      operationId: sendOtp
      tags: [Auth]
      security: []
      summary: 인증코드 발송
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendCodeRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendOtpResponse'
        '400':
          description: |
            - `C001` 유효하지 않은 입력값입니다
        '429':
          description: |
            - `A001` 일일 발송 한도를 초과했습니다
            - `A002` 재전송 대기 시간이 지나지 않았습니다

  /api/v1/auth/otp/verify:
    post:
      operationId: verifyOtp
      tags: [Auth]
      security: []
      summary: 인증코드 검증
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyCodeRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/VerifyOtpLoginResponse'
                  - $ref: '#/components/schemas/VerifyOtpSignupResponse'
                discriminator:
                  propertyName: registered
        '400':
          description: |
            - `C001` 유효하지 않은 입력값입니다
            - `A003` 유효하지 않은 인증번호입니다
            - `A004` 인증번호가 만료되었습니다
            - `A005` 인증 시도 횟수를 초과했습니다

  /api/v1/auth/refresh:
    post:
      operationId: refreshToken
      tags: [Auth]
      security:
        - cookieAuth: []
      summary: 토큰 갱신
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
        '401':
          description: |
            - `A006` 유효하지 않은 리프레시 토큰입니다

  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: 로그아웃
      responses:
        '200':
          description: OK

  # =====================
  # Member Endpoints
  # =====================
  /api/v1/members:
    post:
      operationId: registerMember
      tags: [Members]
      security: []
      summary: 회원가입
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterMemberRequest'
      description: 회원 등록 후 accessToken 반환 + refreshToken httpOnly 쿠키 설정
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterMemberResponse'
        '400':
          description: |
            - `C001` 유효하지 않은 입력값입니다
            - `A009` 유효하지 않은 가입 토큰입니다
            - `A010` 가입 토큰이 만료되었습니다

  /api/v1/members/me:
    get:
      operationId: getMyMember
      tags: [Members]
      summary: 내 정보 조회
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'

    put:
      operationId: updateMyMember
      tags: [Members]
      summary: 내 정보 수정
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberRequest'
      responses:
        '200':
          description: OK
        '400':
          description: |
            - `C001` 유효하지 않은 입력값입니다

    delete:
      operationId: withdraw
      tags: [Members]
      summary: 회원 탈퇴
      responses:
        '200':
          description: OK

  # =====================
  # Post Endpoints
  # =====================
  /api/v1/posts:
    get:
      operationId: getPosts
      tags: [Posts]
      security: []
      summary: 게시글 목록 조회
      parameters:
        - name: authorId
          in: query
          required: false
          description: 작성자 ID로 필터링
          schema:
            type: integer
            format: int64
        - name: taskId
          in: query
          required: false
          description: 작업 ID로 필터링
          schema:
            type: integer
            format: int64
        - name: trade
          in: query
          required: false
          description: 시공분야로 필터링
          schema:
            $ref: '#/components/schemas/Trade'
        - name: minExperience
          in: query
          required: false
          description: 최소 경력 (년)
          schema:
            type: integer
        - name: maxExperience
          in: query
          required: false
          description: 최대 경력 (년)
          schema:
            type: integer
        - name: cursor
          in: query
          required: false
          description: 페이지네이션 커서
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: 페이지 크기 (기본값 20)
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostPage'

    post:
      operationId: createPost
      tags: [Posts]
      summary: 게시글 생성
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: integer
                format: int64
        '400':
          description: |
            - `C001` 유효하지 않은 입력값입니다

  /api/v1/posts/{postId}:
    get:
      operationId: getPost
      tags: [Posts]
      security: []
      summary: 게시글 조회
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'

    put:
      operationId: updatePost
      tags: [Posts]
      summary: 게시글 수정
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePostRequest'
      responses:
        '200':
          description: OK
        '400':
          description: |
            - `C001` 유효하지 않은 입력값입니다

    delete:
      operationId: deletePost
      tags: [Posts]
      summary: 게시글 삭제
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK

  # =====================
  # Task Endpoints
  # =====================
  /api/v1/tasks:
    get:
      operationId: getMyTasks
      tags: [Tasks]
      summary: 내 작업 목록 조회
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'

    post:
      operationId: createTask
      tags: [Tasks]
      summary: 작업 생성
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: integer
                format: int64
        '400':
          description: |
            - `C001` 유효하지 않은 입력값입니다

  /api/v1/tasks/{taskId}:
    get:
      operationId: getTask
      tags: [Tasks]
      security: []
      summary: 작업 조회
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'

    put:
      operationId: updateTask
      tags: [Tasks]
      summary: 작업 수정
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: OK
        '400':
          description: |
            - `C001` 유효하지 않은 입력값입니다

    delete:
      operationId: deleteTask
      tags: [Tasks]
      summary: 작업 삭제
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK

  # =====================
  # Feed Endpoints
  # =====================
  /api/v1/feeds:
    get:
      operationId: getFeeds
      tags: [Feeds]
      security: []
      summary: 피드 목록 조회
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Feed'

  # =====================
  # Chat Endpoints
  # =====================
  /api/v1/chats:
    get:
      operationId: getMyChats
      tags: [Chats]
      summary: 내 채팅방 목록 조회
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Chat'

  /api/v1/chats/{chatId}/messages:
    get:
      operationId: getChatMessages
      tags: [Chats]
      summary: 메시지 목록 조회
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: before
          in: query
          required: false
          description: 이 커서 이전의 메시지를 조회
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: 페이지 크기 (기본값 30)
          schema:
            type: integer
            default: 30
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePage'

  # =====================
  # Profile Endpoints
  # =====================
  /api/v1/profiles:
    get:
      operationId: getProfiles
      tags: [Profiles]
      security: []
      summary: 프로필 목록 조회
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Profile'

    post:
      operationId: createProfile
      tags: [Profiles]
      summary: 프로필 생성
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProfileRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: integer
                format: int64
        '400':
          description: |
            - `C001` 유효하지 않은 입력값입니다

  /api/v1/profiles/{profileId}:
    get:
      operationId: getProfile
      tags: [Profiles]
      security: []
      summary: 프로필 조회
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'

  /api/v1/profiles/me:
    put:
      operationId: updateMyProfile
      tags: [Profiles]
      summary: 내 프로필 수정
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: OK
        '400':
          description: |
            - `C001` 유효하지 않은 입력값입니다

  /api/v1/profiles/me/about:
    patch:
      operationId: updateMyProfileAbout
      tags: [Profiles]
      summary: 내 자기소개 수정
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileAboutRequest'
      responses:
        '200':
          description: OK

    delete:
      operationId: deleteMyProfile
      tags: [Profiles]
      summary: 내 프로필 삭제
      responses:
        '200':
          description: OK

  # =====================
  # Credential Endpoints
  # =====================
  /api/v1/credentials:
    get:
      operationId: getCredentials
      tags: [Credentials]
      security: []
      summary: 인증뱃지 목록 조회
      parameters:
        - name: profileId
          in: query
          required: true
          description: 프로필 ID
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Credential'

    post:
      operationId: createCredential
      tags: [Credentials]
      summary: 인증뱃지 등록
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCredentialRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: integer
                format: int64
        '400':
          description: |
            - `C001` 유효하지 않은 입력값입니다

  /api/v1/credentials/{credentialId}/accept:
    post:
      operationId: acceptCredential
      tags: [Credentials]
      summary: 인증뱃지 승인
      parameters:
        - name: credentialId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK

  /api/v1/credentials/{credentialId}/deny:
    post:
      operationId: denyCredential
      tags: [Credentials]
      summary: 인증뱃지 거부
      parameters:
        - name: credentialId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK

  /api/v1/credentials/{credentialId}:
    delete:
      operationId: deleteCredential
      tags: [Credentials]
      summary: 인증뱃지 삭제
      parameters:
        - name: credentialId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK

  # =====================
  # Coworker Endpoints
  # =====================
  /api/v1/coworkers:
    get:
      operationId: getCoworkers
      tags: [Coworkers]
      summary: 동료 목록 조회
      parameters:
        - name: profileId
          in: query
          required: true
          description: 프로필 ID
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Coworker'

  /api/v1/coworkers/{coworkerId}:
    delete:
      operationId: deleteCoworker
      tags: [Coworkers]
      summary: 동료 삭제
      parameters:
        - name: coworkerId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK

  # =====================
  # CoworkerRequest Endpoints
  # =====================
  /api/v1/coworker-requests:
    post:
      operationId: createCoworkerRequest
      tags: [CoworkerRequests]
      summary: 동료요청 생성
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCoworkerRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: integer
                format: int64
        '400':
          description: |
            - `C001` 유효하지 않은 입력값입니다

  /api/v1/coworker-requests/{id}:
    delete:
      operationId: cancelCoworkerRequest
      tags: [CoworkerRequests]
      summary: 동료요청 취소
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK

  /api/v1/coworker-requests/{id}/accept:
    post:
      operationId: acceptCoworkerRequest
      tags: [CoworkerRequests]
      summary: 동료요청 수락
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK

  /api/v1/coworker-requests/{id}/deny:
    post:
      operationId: denyCoworkerRequest
      tags: [CoworkerRequests]
      summary: 동료요청 거절
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: refreshToken

  schemas:
    # =====================
    # Common
    # =====================
    CursorPageMeta:
      type: object
      required: [hasMore]
      properties:
        nextCursor:
          type: string
          nullable: true
          description: 다음 페이지 커서 (마지막 페이지면 null)
        hasMore:
          type: boolean
          description: 다음 페이지 존재 여부

    Address:
      type: object
      properties:
        zipcode:
          type: string
          pattern: '\d{5}'
          example: '04524'
        city:
          type: string
        state:
          type: string
        street:
          type: string
        detail:
          type: string
        latitude:
          type: number
          format: double
          example: 37.5666805
        longitude:
          type: number
          format: double
          example: 126.9784147

    Role:
      type: string
      enum:
        - GUEST
        - CLIENT
        - ARCHITECT
        - CONTRACTOR
        - FOREMAN
        - SKILLED
        - SEMI_SKILLED
        - HELPER
        - ADMIN

    Trade:
      type: string
      enum:
        # 기반 공정
        - DESIGN
        - DEMOLITION
        - ELECTRICAL
        - PLUMBING
        - MECHANICAL
        # 구조 공정
        - MASONRY
        - CARPENTRY
        - GLAZING
        - WATERPROOFING
        - PLASTERING
        - INSULATION
        # 마감 공정
        - TILING
        - GROUTING
        - PAINTING
        - WALLPAPER
        - FILM_SHEET
        - HARDWOOD
        - VINYL
        # 설치
        - SINK
        - FURNITURE
        - AIR_CONDITIONING
        # 현장지원
        - HOISTING
        - TRANSPORT
        - CLEANING
        - GENERAL_LABOR

    # =====================
    # Auth Schemas
    # =====================
    SendCodeRequest:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
          pattern: '\d{10,11}'

    SendOtpResponse:
      type: object
      properties:
        expiresAt:
          type: string
          format: date-time

    VerifyCodeRequest:
      type: object
      required: [phone, code]
      properties:
        phone:
          type: string
          pattern: '\d{10,11}'
        code:
          type: string
          pattern: '\d{6}'

    VerifyOtpLoginResponse:
      description: 로그인 성공 응답. refreshToken은 httpOnly 쿠키(refreshToken)로 전달됩니다.
      type: object
      required: [registered, accessToken]
      properties:
        registered:
          type: boolean
          enum: [true]
        accessToken:
          type: string

    VerifyOtpSignupResponse:
      type: object
      required: [registered, signupToken]
      properties:
        registered:
          type: boolean
          enum: [false]
        signupToken:
          type: string

    RefreshTokenResponse:
      type: object
      properties:
        accessToken:
          type: string

    RegisterMemberResponse:
      description: 회원 등록 응답. refreshToken은 httpOnly 쿠키로 전달됩니다.
      type: object
      required: [memberId, accessToken]
      properties:
        memberId:
          type: integer
          format: int64
        accessToken:
          type: string

    # =====================
    # Member Schemas
    # =====================
    Member:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        username:
          type: string
        name:
          type: string
        phone:
          type: string
        picture:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        createdAt:
          type: string
          format: date-time
        modifiedAt:
          type: string
          format: date-time

    RegisterMemberRequest:
      type: object
      required: [signupToken, username, name, phone, picture, role]
      properties:
        signupToken:
          type: string
        username:
          type: string
        name:
          type: string
        phone:
          type: string
          pattern: '\d{10,11}'
        picture:
          type: string
        role:
          $ref: '#/components/schemas/Role'

    UpdateMemberRequest:
      type: object
      required: [name, role]
      properties:
        name:
          type: string
        picture:
          type: string
        role:
          $ref: '#/components/schemas/Role'

    # =====================
    # Profile Schemas
    # =====================
    Profile:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        memberId:
          type: integer
          format: int64
          example: 1
        primaryTrade:
          $ref: '#/components/schemas/Trade'
        trades:
          type: array
          items:
            $ref: '#/components/schemas/Trade'
          uniqueItems: true
        experience:
          type: integer
        headline:
          type: string
          nullable: true
