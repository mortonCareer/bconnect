          required: true
          description: 프로필 ID
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Recommendation'

  /api/v1/recommendations/me/received:
    get:
      operationId: getMyReceivedRecommendations
      tags: [Recommendations]
      summary: 내가 받은 추천서 목록 조회
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Recommendation'

  /api/v1/recommendations/me/sent:
    get:
      operationId: getMySentRecommendations
      tags: [Recommendations]
      summary: 내가 보낸 추천서 목록 조회
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Recommendation'

  /api/v1/recommendations/{id}:
    put:
      operationId: updateRecommendation
      tags: [Recommendations]
      summary: 추천서 수정
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRecommendationRequest'
      responses:
        '200':
          description: OK

    delete:
      operationId: deleteRecommendation
      tags: [Recommendations]
      summary: 추천서 삭제
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK

  /api/v1/recommendations/{id}/hide:
    post:
      operationId: hideRecommendation
      tags: [Recommendations]
      summary: 추천서 숨김
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK

  /api/v1/recommendations/{id}/show:
    post:
      operationId: showRecommendation
      tags: [Recommendations]
      summary: 추천서 숨김 해제
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK

  # =====================
  # CoworkerRequest Endpoints
  # =====================
  /api/v1/coworker-requests:
    post:
      operationId: createCoworkerRequest
      tags: [CoworkerRequests]
      summary: 동료요청 생성
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCoworkerRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: integer
                format: int64
        '400':
          description: |
            - `C001` 유효하지 않은 입력값입니다

  /api/v1/coworker-requests/received:
    get:
      operationId: getReceivedCoworkerRequests
      tags: [CoworkerRequests]
      summary: 받은 동료 요청 목록 조회
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CoworkerRequest'

  /api/v1/coworker-requests/sent:
    get:
      operationId: getSentCoworkerRequests
      tags: [CoworkerRequests]
      summary: 보낸 동료 요청 목록 조회
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CoworkerRequest'

  /api/v1/coworker-requests/{id}:
    delete:
      operationId: cancelCoworkerRequest
      tags: [CoworkerRequests]
      summary: 동료요청 취소
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK

  /api/v1/coworker-requests/{id}/accept:
    post:
      operationId: acceptCoworkerRequest
      tags: [CoworkerRequests]
      summary: 동료요청 수락
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK

  /api/v1/coworker-requests/{id}/deny:
    post:
      operationId: denyCoworkerRequest
      tags: [CoworkerRequests]
      summary: 동료요청 거절
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        인증이 필요한 엔드포인트에 공통으로 다음 에러를 반환할 수 있습니다.
        - `A007` 유효하지 않은 액세스 토큰입니다 (401)
        - `A008` 세션이 만료되었습니다 (401)
    cookieAuth:
      type: apiKey
      in: cookie
      name: refreshToken

  schemas:
    # =====================
    # Common - Error
    # =====================
    ApiError:
      type: object
      required: [code, status]
      properties:
        code:
          type: string
          example: 'C001'
        status:
          type: string
          example: 'BAD_REQUEST'

    ApiErrorResponse:
      type: object
      required: [success, error, data]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          $ref: '#/components/schemas/ApiError'
        data:
          nullable: true

    # =====================
    # Common
    Address:
      type: object
      required: [zipcode, city, state, street, latitude, longitude]
      properties:
        zipcode:
          type: string
          pattern: '\d{5}'
          example: '04524'
        city:
          type: string
        state:
          type: string
        street:
          type: string
        detail:
          type: string
          nullable: true
        latitude:
          type: number
          format: double
          example: 37.5666805
        longitude:
          type: number
          format: double
          example: 126.9784147

    Role:
      type: string
      enum:
        - GUEST
        - CLIENT
        - ARCHITECT
        - CONTRACTOR
        - FOREMAN
        - SKILLED
        - SEMI_SKILLED
        - HELPER
        - ADMIN

    Trade:
      type: string
      enum:
        # 기반 공정
        - DESIGN
        - DEMOLITION
        - ELECTRICAL
        - PLUMBING
        - MECHANICAL
        # 구조 공정
        - MASONRY
        - CARPENTRY
        - GLAZING
        - WATERPROOFING
        - PLASTERING
        - INSULATION
        # 마감 공정
        - TILING
        - GROUTING
        - PAINTING
        - WALLPAPER
        - FILM_SHEET
        - HARDWOOD
        - VINYL
        # 설치
        - SINK
        - FURNITURE
        - AIR_CONDITIONING
        # 현장지원
        - HOISTING
        - TRANSPORT
        - CLEANING
        - GENERAL_LABOR

    # =====================
    # Auth Schemas
    # =====================
    SendCodeRequest:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
          pattern: '\d{10,11}'

    SendOtpResponse:
      type: object
      required: [expiresAt]
      properties:
        expiresAt:
          type: string
          format: date-time

    VerifyCodeRequest:
      type: object
      required: [phone, code]
      properties:
        phone:
          type: string
          pattern: '\d{10,11}'
        code:
          type: string
          pattern: '\d{6}'

    VerifyOtpLoginResponse:
      type: object
      required: [registered, accessToken, refreshToken]
      properties:
        registered:
          type: boolean
          enum: [true]
        accessToken:
          type: string
        refreshToken:
          type: string

    VerifyOtpSignupResponse:
      type: object
      required: [registered, signupToken]
      properties:
        registered:
          type: boolean
          enum: [false]
        signupToken:
          type: string

    RefreshTokenResponse:
      type: object
      required: [accessToken, refreshToken]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string

    # =====================
    # Member Schemas
    # =====================
    Member:
      type: object
      required: [id, username, name, phone, role, createdAt, modifiedAt]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        username:
          type: string
        name:
          type: string
        phone:
          type: string
        picture:
          type: string
          nullable: true
        role:
          $ref: '#/components/schemas/Role'
        createdAt:
          type: string
          format: date-time
        modifiedAt:
          type: string
          format: date-time

    RegisterMemberRequest:
      type: object
      required: [signupToken, username, name, role]
      properties:
        signupToken:
          type: string
        username:
          type: string
        name:
          type: string
        picture:
          type: string
          format: uri
          nullable: true
        role:
          $ref: '#/components/schemas/Role'

    CheckUsernameResponse:
      type: object
      required: [available]
      properties:
        available:
          type: boolean

    UpdateMemberRequest:
      type: object
      required: [name, role]
      properties:
        name:
          type: string
        picture:
          type: string
          format: uri
          nullable: true
        role:
          $ref: '#/components/schemas/Role'

    # =====================
    # Profile Schemas
    # =====================
    Profile:
      type: object
      required: [id, memberId, primaryTrade, trades, experience, address, createdAt, modifiedAt]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        memberId:
          type: integer
          format: int64
          example: 1
        primaryTrade:
          $ref: '#/components/schemas/Trade'
        trades:
          type: array
          items:
            $ref: '#/components/schemas/Trade'
          uniqueItems: true
        experience:
          type: integer
        headline:
          type: string
          nullable: true
        about:
          type: string
          nullable: true
        address:
          $ref: '#/components/schemas/Address'
        createdAt:
          type: string
          format: date-time
        modifiedAt:
          type: string
          format: date-time

    UpdateProfileRequest:
      type: object
      required: [primaryTrade, trades, experience, address]
      properties:
        primaryTrade:
          $ref: '#/components/schemas/Trade'
        trades:
          type: array
          items:
            $ref: '#/components/schemas/Trade'
          uniqueItems: true
          minItems: 1
        experience:
          type: integer
          minimum: 0
        headline:
          type: string
          nullable: true
        address:
          $ref: '#/components/schemas/Address'

    CreateProfileRequest:
      type: object
      required: [primaryTrade, trades, experience, address]
      properties:
        primaryTrade:
          $ref: '#/components/schemas/Trade'
        trades:
          type: array
          items:
            $ref: '#/components/schemas/Trade'
          uniqueItems: true
          minItems: 1
        experience:
          type: integer
          minimum: 0
        headline:
          type: string
          nullable: true
        about:
          type: string
          nullable: true
        address:
          $ref: '#/components/schemas/Address'

    UpdateProfileAboutRequest:
      type: object
      properties:
        about:
          type: string
          nullable: true

    # =====================
    # Feed Schemas
    # =====================
    Feed:
      type: object
      required: [member, profile, post]
      properties:
        member:
          $ref: '#/components/schemas/Member'
        profile:
          $ref: '#/components/schemas/Profile'
        post:
          $ref: '#/components/schemas/Post'

    # =====================
    # Post Schemas
    # =====================
    Post:
      type: object
      required: [id, images, createdAt, modifiedAt]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        profileId:
          type: integer
          format: int64
          example: 1
          nullable: true
        taskId:
          type: integer
          format: int64
          example: 1
          nullable: true
        images:
          type: array
          items:
            type: string
        content:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        modifiedAt:
          type: string
          format: date-time

    CreatePostRequest:
      type: object
      required: [images, content]
      properties:
        taskId:
          type: integer
          format: int64
          example: 1
          nullable: true
        images:
          type: array
          items:
            type: string
            format: uri
          minItems: 1
        content:
          type: string

    UpdatePostRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string

    # =====================
    # Task Schemas
    # =====================
    Task:
      type: object
      required: [id, company, address, taskTitle, eventTitle, trades, start, end, createdAt, modifiedAt]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        profileId:
          type: integer
          format: int64
          example: 1
          nullable: true
        company:
          type: string
        address:
          $ref: '#/components/schemas/Address'
        taskTitle:
          type: string
        eventTitle:
          type: string
        trades:
          type: array
          items:
            $ref: '#/components/schemas/Trade'
          uniqueItems: true
        start:
          type: string
          format: date
        end:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
        modifiedAt:
          type: string
          format: date-time

    CreateTaskRequest:
      type: object
      required: [company, address, taskTitle, eventTitle, trades, start, end]
      properties:
        company:
          type: string
        address:
          $ref: '#/components/schemas/Address'
        taskTitle:
          type: string
        eventTitle:
          type: string
        trades:
          type: array
          items:
            $ref: '#/components/schemas/Trade'
          uniqueItems: true
        start:
          type: string
          format: date
        end:
          type: string
          format: date

    UpdateTaskRequest:
      type: object
      required: [company, address, taskTitle, eventTitle, trades, start, end]
      properties:
        company:
          type: string
        address:
          $ref: '#/components/schemas/Address'
        taskTitle:
          type: string
        eventTitle:
          type: string
        trades:
          type: array
          items:
            $ref: '#/components/schemas/Trade'
          uniqueItems: true
        start:
          type: string
          format: date
        end:
          type: string
          format: date

    # =====================
    # Credential Schemas
    # =====================
    CredentialType:
      type: string
      enum:
        # 사업자 및 면허
        - IDENTITY_VERIFICATION
        - SOLE_PROPRIETOR
        - CONSTRUCTION_LICENSE
        - SPECIALTY_CONSTRUCTION_LICENSE
        # 증명서
        - CAREER_CERTIFICATE
        - SKILL_GRADE_CERTIFICATE
        - OTHER_CERTIFICATE
        # 자격증
        - NATIONAL_TECHNICAL_QUALIFICATION
        - SKILLED_TECHNICIAN
        - OTHER_QUALIFICATION

    CredentialStatus:
      type: string
      enum:
        - PENDING
        - ACCEPTED
        - DENIED

    Credential:
      type: object
      required: [id, profileId, type, status, createdAt, modifiedAt]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        profileId:
          type: integer
          format: int64
          example: 1
        type:
          $ref: '#/components/schemas/CredentialType'
        status:
          $ref: '#/components/schemas/CredentialStatus'
        expiredAt:
          type: string
          format: date
          nullable: true
        createdAt:
          type: string
          format: date-time
        modifiedAt:
          type: string
          format: date-time

    CreateCredentialRequest:
      type: object
      required: [type]
      properties:
        type:
          $ref: '#/components/schemas/CredentialType'
        expiredAt:
          type: string
          format: date
          nullable: true

    # =====================
    # Coworker Schemas
    # =====================
    Coworker:
      type: object
      required: [id, minId, maxId]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        minId:
          type: integer
          format: int64
          example: 1
        maxId:
          type: integer
          format: int64
          example: 2

    # =====================
    # CoworkerRequest Schemas
    # =====================
    CoworkerRequest:
      type: object
      required: [id, fromId, toId]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        fromId:
          type: integer
          format: int64
          example: 1
        toId:
          type: integer
          format: int64
          example: 2

    CreateCoworkerRequest:
      type: object
      required: [toId]
      properties:
        toId:
          type: integer
          format: int64
          example: 1

    # =====================
    # Pagination Schemas
    # =====================
    FeedOffsetPage:
      type: object
      required: [content, hasNext]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Feed'
        hasNext:
          type: boolean

    MessageCursorPage:
      type: object
      required: [content, hasNext]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        nextCursor:
          type: string
          nullable: true
        hasNext:
          type: boolean

    # =====================
    # Chat Schemas
    # =====================
    MessageType:
      type: string
      enum:
        - TEXT
        - IMAGE
        - FILE
        - SYSTEM

    Chat:
      type: object
      required: [id, title, participantIds, lastMessage, unreadCount, createdAt, modifiedAt]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        title:
          type: string
        participantIds:
          type: array
          items:
            type: integer
            format: int64
        lastMessage:
          $ref: '#/components/schemas/Message'
        unreadCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        modifiedAt:
          type: string
          format: date-time

    Message:
      type: object
      required: [id, chatId, memberId, type, content, createdAt, modifiedAt]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        chatId:
          type: integer
          format: int64
          example: 1
        memberId:
          type: integer
          format: int64
          example: 1
        type:
          $ref: '#/components/schemas/MessageType'
        content:
          type: string
        createdAt:
          type: string
          format: date-time
        modifiedAt:
          type: string
          format: date-time

    CreateDirectChatRequest:
      type: object
      required: [participantId]
      properties:
        participantId:
          type: integer
          format: int64

    # =====================
    # Recommendation Schemas
    # =====================
    Recommendation:
      type: object
      required: [id, fromId, toId, content, visible, createdAt, modifiedAt]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        fromId:
          type: integer
          format: int64
          example: 1
        toId:
          type: integer
          format: int64
          example: 2
        content:
          type: string
        visible:
          type: boolean
        createdAt:
          type: string
          format: date-time
        modifiedAt:
          type: string
          format: date-time

    CreateRecommendationRequest:
      type: object
      required: [toId, content]
      properties:
        toId:
          type: integer
          format: int64
        content:
          type: string

    UpdateRecommendationRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
