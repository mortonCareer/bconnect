        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CredentialType'

  /api/v1/credentials:
    get:
      operationId: getCredentials
      tags: [Credentials]
      security: []
      summary: 인증뱃지 목록 조회
      parameters:
        - name: profileId
          in: query
          required: true
          description: 프로필 ID
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Credential'

    post:
      operationId: createCredential
      tags: [Credentials]
      summary: 인증뱃지 등록
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCredentialRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: integer
                format: int64
        '400':
          description: |
            - `C001` 유효하지 않은 입력값입니다

  /api/v1/credentials/{credentialId}/accept:
    post:
      operationId: acceptCredential
      tags: [Credentials]
      summary: (ADMIN) 인증뱃지 승인
      parameters:
        - name: credentialId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK

  /api/v1/credentials/{credentialId}/deny:
    post:
      operationId: denyCredential
      tags: [Credentials]
      summary: (ADMIN) 인증뱃지 거부
      parameters:
        - name: credentialId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK

  /api/v1/credentials/{credentialId}:
    delete:
      operationId: deleteCredential
      tags: [Credentials]
      summary: 인증뱃지 삭제
      parameters:
        - name: credentialId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK

  # =====================
  # Coworker Endpoints
  # =====================
  /api/v1/coworkers:
    get:
      operationId: getCoworkers
      tags: [Coworkers]
      summary: 동료 목록 조회
      parameters:
        - name: profileId
          in: query
          required: true
          description: 프로필 ID
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Coworker'

  /api/v1/coworkers/{coworkerId}:
    delete:
      operationId: deleteCoworker
      tags: [Coworkers]
      summary: 동료 삭제
      parameters:
        - name: coworkerId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK

  # =====================
  # Chat Endpoints
  # =====================
  /api/v1/chats:
    get:
      operationId: getMyChats
      tags: [Chats]
      summary: 내 채팅방 목록 조회
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Chat'

  /api/v1/chats/direct:
    post:
      operationId: createDirectChat
      tags: [Chats]
      summary: 일대일 채팅 생성
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDirectChatRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chat'

  /api/v1/chats/{chatId}/messages:
    get:
      operationId: getChatMessages
      tags: [Chats]
      summary: 채팅방 메시지 목록 조회
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: cursor
          in: query
          required: false
          description: 페이지네이션 커서 (null이면 최신 메시지부터)
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: reverse
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageCursorPage'

  # =====================
  # Recommendation Endpoints
  # =====================
  /api/v1/recommendations:
    post:
      operationId: createRecommendation
      tags: [Recommendations]
