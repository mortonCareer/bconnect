components:
  schemas:
    Address:
      type: object
      properties:
        zipcode:
          type: string
        city:
          type: string
        state:
          type: string
        street:
          type: string
        detail:
          type: string
        latitude:
          type: number
        longitude:
          type: number
    Trade:
      type: string
      enum:
      - DESIGN
      - DEMOLITION
      - ELECTRICAL
      - PLUMBING
      - MECHANICAL
      - MASONRY
      - CARPENTRY
      - GLAZING
      - WATERPROOFING
      - PLASTERING
      - INSULATION
      - TILING
      - GROUTING
      - PAINTING
      - WALLPAPER
      - FILM_SHEET
      - HARDWOOD
      - VINYL
      - SINK
      - FURNITURE
      - AIR_CONDITIONING
      - HOISTING
      - TRANSPORT
      - CLEANING
      - GENERAL_LABOR
    UpdateTaskRequest:
      type: object
      properties:
        company:
          type: string
          minLength: 1
        address:
          $ref: "#/components/schemas/Address"
        taskTitle:
          type: string
          minLength: 1
        eventTitle:
          type: string
          minLength: 1
        trades:
          type: array
          items:
            $ref: "#/components/schemas/Trade"
          uniqueItems: true
        start:
          type: string
          format: date
        end:
          type: string
          format: date
      required:
      - address
      - company
      - end
      - eventTitle
      - start
      - taskTitle
      - trades
    ApiResponseVoid:
      type: object
      properties:
        success:
          type: boolean
        error:
          $ref: "#/components/schemas/ExceptionCode"
        data: {}
    ExceptionCode:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/HttpStatus"
        code:
          type: string
    HttpStatus:
      type: string
      enum:
      - 100 CONTINUE
      - 101 SWITCHING_PROTOCOLS
      - 102 PROCESSING
      - 103 EARLY_HINTS
      - 200 OK
      - 201 CREATED
      - 202 ACCEPTED
      - 203 NON_AUTHORITATIVE_INFORMATION
      - 204 NO_CONTENT
      - 205 RESET_CONTENT
      - 206 PARTIAL_CONTENT
      - 207 MULTI_STATUS
      - 208 ALREADY_REPORTED
      - 226 IM_USED
      - 300 MULTIPLE_CHOICES
      - 301 MOVED_PERMANENTLY
      - 302 FOUND
      - 303 SEE_OTHER
      - 304 NOT_MODIFIED
      - 307 TEMPORARY_REDIRECT
      - 308 PERMANENT_REDIRECT
      - 400 BAD_REQUEST
      - 401 UNAUTHORIZED
      - 402 PAYMENT_REQUIRED
      - 403 FORBIDDEN
      - 404 NOT_FOUND
      - 405 METHOD_NOT_ALLOWED
      - 406 NOT_ACCEPTABLE
      - 407 PROXY_AUTHENTICATION_REQUIRED
      - 408 REQUEST_TIMEOUT
      - 409 CONFLICT
      - 410 GONE
      - 411 LENGTH_REQUIRED
      - 412 PRECONDITION_FAILED
      - 413 CONTENT_TOO_LARGE
      - 413 PAYLOAD_TOO_LARGE
      - 414 URI_TOO_LONG
      - 415 UNSUPPORTED_MEDIA_TYPE
      - 416 REQUESTED_RANGE_NOT_SATISFIABLE
      - 417 EXPECTATION_FAILED
      - 418 I_AM_A_TEAPOT
      - 421 MISDIRECTED_REQUEST
      - 422 UNPROCESSABLE_CONTENT
      - 422 UNPROCESSABLE_ENTITY
      - 423 LOCKED
      - 424 FAILED_DEPENDENCY
      - 425 TOO_EARLY
      - 426 UPGRADE_REQUIRED
      - 428 PRECONDITION_REQUIRED
      - 429 TOO_MANY_REQUESTS
      - 431 REQUEST_HEADER_FIELDS_TOO_LARGE
      - 451 UNAVAILABLE_FOR_LEGAL_REASONS
      - 500 INTERNAL_SERVER_ERROR
      - 501 NOT_IMPLEMENTED
      - 502 BAD_GATEWAY
      - 503 SERVICE_UNAVAILABLE
      - 504 GATEWAY_TIMEOUT
      - 505 HTTP_VERSION_NOT_SUPPORTED
      - 506 VARIANT_ALSO_NEGOTIATES
      - 507 INSUFFICIENT_STORAGE
      - 508 LOOP_DETECTED
      - 509 BANDWIDTH_LIMIT_EXCEEDED
      - 510 NOT_EXTENDED
      - 511 NETWORK_AUTHENTICATION_REQUIRED
    UpdateRecommendationRequest:
      type: object
      properties:
        content:
          type: string
          minLength: 1
      required:
      - content
    UpdateProfileRequest:
      type: object
      properties:
        primaryTrade:
          $ref: "#/components/schemas/Trade"
        trades:
          type: array
          items:
            $ref: "#/components/schemas/Trade"
          maxItems: 2147483647
          minItems: 1
          uniqueItems: true
        experience:
          type: integer
          format: int32
        headline:
          type: string
        address:
          $ref: "#/components/schemas/Address"
      required:
      - address
      - experience
      - primaryTrade
      - trades
    UpdatePostRequest:
      type: object
      properties:
        content:
          type: string
          minLength: 1
      required:
      - content
    Role:
      type: string
      enum:
      - GUEST
      - CLIENT
      - ARCHITECT
      - CONTRACTOR
      - FOREMAN
      - SKILLED
      - SEMI_SKILLED
      - HELPER
      - ADMIN
    UpdateMemberRequest:
      type: object
